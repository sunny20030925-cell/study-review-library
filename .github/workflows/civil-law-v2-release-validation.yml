name: Civil law v2 release validation

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/civil-law-v2-release-validation.yml'
      - 'deploy/apply_civil_law_overview_v2.py'
      - 'deploy/record_civil_law_overview_v2_deployment.py'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile civil v2 release scripts
        run: |
          set -euo pipefail
          python -m py_compile \
            deploy/civil_law_overview_v2_corrections.py \
            deploy/civil_law_overview_questions_v2.py \
            deploy/patch_civil_law_overview_v2.py \
            deploy/apply_civil_law_overview_v2.py \
            deploy/qa_civil_law_overview_reaudit_v2.py \
            deploy/record_civil_law_overview_v2_deployment.py

      - name: Download latest verified formal Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_id'])")"
          DIGEST="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_digest'])")"
          EXPECTED_VERSION="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['library_version'])")"
          EXPECTED_COUNT="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['book_count'])")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/base.zip
          echo "${DIGEST#sha256:}  /tmp/base.zip" | sha256sum --check -
          mkdir -p /tmp/unpack _site
          unzip -q /tmp/base.zip -d /tmp/unpack
          if [ -f /tmp/unpack/artifact.tar ]; then
            tar -xf /tmp/unpack/artifact.tar -C _site
          elif [ -f /tmp/unpack/artifact.tar.gz ]; then
            tar -xzf /tmp/unpack/artifact.tar.gz -C _site
          else
            cp -a /tmp/unpack/. _site/
          fi
          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_COUNT="$EXPECTED_COUNT" python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('_site')
          lib=json.load(open(site/'data/library.json'))
          ids=[b['id'] for b in lib['books']]
          assert lib['version']==os.environ['EXPECTED_VERSION']
          assert len(ids)==int(os.environ['EXPECTED_COUNT'])
          assert ids.count('civil-law-overview')==1
          root=site/'books/civil-law-overview'
          m=json.load(open(root/'manifest.json')); q=json.load(open(root/'questions.json')); s=json.load(open(root/'search.json'))
          assert m['version']==q['version']=='2026.07.29-1'
          assert len(m['chapters'])==23 and q['count']==100 and len(s['entries'])==150
          print('FORMAL_CIVIL_V1_BASE_OK',lib['version'],len(ids))
          PY

      - name: Apply civil v2 and preserve all other books
        run: |
          set -euo pipefail
          cp _site/data/library.json /tmp/pre-library.json
          find _site/books -type f ! -path '*/civil-law-overview/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-other-books.sha256
          find _site/assets -type f ! -path '*/civil-law-overview-svg/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-other-assets.sha256

          FINAL_LIBRARY_VERSION="$(PYTHONPATH=deploy python deploy/apply_civil_law_overview_v2.py _site | tail -n 1)"
          CIVIL_CHECKS="$(PYTHONPATH=deploy python deploy/qa_civil_law_overview_reaudit_v2.py _site "$FINAL_LIBRARY_VERSION" | tee /tmp/civil-v2.log | grep -oE '(^| )checks=[0-9]+' | head -n1 | cut -d= -f2)"
          test "$CIVIL_CHECKS" = "147"

          find _site/books -type f ! -path '*/civil-law-overview/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-other-books.sha256
          find _site/assets -type f ! -path '*/civil-law-overview-svg/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-other-assets.sha256
          diff -u /tmp/pre-other-books.sha256 /tmp/post-other-books.sha256
          diff -u /tmp/pre-other-assets.sha256 /tmp/post-other-assets.sha256

          FINAL_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" python - <<'PY'
          import json,os,re
          pre=json.load(open('/tmp/pre-library.json'))
          post=json.load(open('_site/data/library.json'))
          assert [b['id'] for b in pre['books']]==[b['id'] for b in post['books']]
          assert post['version']==os.environ['FINAL_LIBRARY_VERSION']
          def key(v):
              m=re.fullmatch(r'(\d{4}\.\d{2}\.\d{2})-(\d+)',v); assert m
              return m.group(1),int(m.group(2))
          pd,pn=key(pre['version']); nd,nn=key(post['version'])
          assert pd==nd and nn==pn+1,(pre['version'],post['version'])
          root='_site/books/civil-law-overview'
          m=json.load(open(root+'/manifest.json')); q=json.load(open(root+'/questions.json')); s=json.load(open(root+'/search.json'))
          assert m['version']==q['version']=='2026.07.30-2'
          assert len(m['chapters'])==23 and q['count']==100 and len(s['entries'])==150
          assert len(list(__import__('pathlib').Path('_site/assets/civil-law-overview-svg').glob('*.svg')))==20
          print('CIVIL_V2_FORMAL_ARTIFACT_SIMULATION_OK',pre['version'],'->',post['version'],len(post['books']))
          PY
          node --check _site/app.js
          node --check _site/sw.js
