name: Stage audited microeconomics v2 canonical integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  stage:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'stage-micro-v2-canonical-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled staging branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Stage exact audited files and a validated canonical candidate
        run: |
          AUDITED_SHA='9188061773d242a5abb8797888e251305b4a8b47'
          git fetch origin agent/microeconomics-post-publication-reaudit-v2
          test "$(git rev-parse FETCH_HEAD)" = "$AUDITED_SHA"
          git checkout "$AUDITED_SHA" -- \
            deploy/patch_microeconomics_v2.py \
            deploy/qa_microeconomics_v2.py \
            deploy/integrate_microeconomics_v2.py \
            docs/books/microeconomics/qa_report.md \
            docs/books/microeconomics/status.md
          python -m py_compile \
            deploy/patch_microeconomics_v2.py \
            deploy/qa_microeconomics_v2.py \
            deploy/integrate_microeconomics_v2.py
          cp .github/workflows/deploy-pages.yml deploy/staged-micro-v2-deploy-pages.yml
          if ! grep -Fq "'microeconomics_version': '2026.07.29-2'" deploy/staged-micro-v2-deploy-pages.yml; then
            python deploy/integrate_microeconomics_v2.py deploy/staged-micro-v2-deploy-pages.yml
          fi
          ruby -e "require 'yaml'; YAML.parse_file('deploy/staged-micro-v2-deploy-pages.yml'); puts 'STAGED_YAML_PARSE_OK'"
          grep -F 'python deploy/patch_microeconomics_v2.py _site' deploy/staged-micro-v2-deploy-pages.yml
          grep -F "'microeconomics_post_publication_correction_count': 16" deploy/staged-micro-v2-deploy-pages.yml
          grep -F "'microeconomics_question_adjustment_count': 4" deploy/staged-micro-v2-deploy-pages.yml
          grep -F "'microeconomics_independent_check_count': 1616" deploy/staged-micro-v2-deploy-pages.yml

      - name: Apply corrections to the current deployed artifact and run full QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/current-pages /tmp/current-site
          mkdir -p /tmp/current-pages /tmp/current-site
          gh run download 30416984356 \
            --repo "$GITHUB_REPOSITORY" \
            --name github-pages \
            --dir /tmp/current-pages
          test -f /tmp/current-pages/artifact.tar
          tar -xf /tmp/current-pages/artifact.tar -C /tmp/current-site
          test "$(python -c "import json; print(json.load(open('/tmp/current-site/books/microeconomics/manifest.json'))['version'])")" = '2026.07.29-1'
          python deploy/patch_microeconomics_v2.py /tmp/current-site
          python deploy/qa_microeconomics_v2.py /tmp/current-site

      - name: Commit staged candidate to PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            deploy/staged-micro-v2-deploy-pages.yml \
            deploy/patch_microeconomics_v2.py \
            deploy/qa_microeconomics_v2.py \
            deploy/integrate_microeconomics_v2.py \
            docs/books/microeconomics/qa_report.md \
            docs/books/microeconomics/status.md
          if git diff --cached --quiet; then
            echo 'Audited microeconomics v2 candidate already staged.'
            exit 0
          fi
          git commit -m "Stage audited microeconomics v2 canonical candidate"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
