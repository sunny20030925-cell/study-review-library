name: Integrate verified commercial law reaudit

on:
  push:
    paths:
      - 'docs/books/commercial-law/integrate_reaudit.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update canonical five-book deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-pages.yml')
          text = p.read_text(encoding='utf-8')

          if 'Apply commercial law post-publication corrections' not in text:
              old = "          python /tmp/generate-commercial-law.py _site\n\n      - name: Add visible per-book version verification"
              new = "          python /tmp/generate-commercial-law.py _site\n\n      - name: Apply commercial law post-publication corrections\n        run: |\n          python deploy/patch-commercial-law-reaudit.py _site\n\n      - name: Add visible per-book version verification"
              if old not in text:
                  raise SystemExit('generator insertion point not found')
              text = text.replace(old, new, 1)

          start = text.find("              'commercial-law': {\n")
          end_marker = "              },\n          }\n"
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('commercial release block boundaries not found')
          end += len("              },\n")
          new_block = """              'commercial-law': {\n                  'updatedAt': '2026-07-29',\n                  'releaseNotes': [{\n                      'version': '2026.07.29-1',\n                      'date': '2026-07-29',\n                      'title': '發布後獨立內容複核與法律精確化',\n                      'changes': [\n                          '限縮公司法第 8 條實質董事規則至公開發行股票之公司，補正第 194 條繼續持股 1 年門檻',\n                          '補入已依證交法發行股票公司董事至少 5 人、公開發行公司董事會原則 7 日前通知與利害關係董事表決排除',\n                          '補正閉鎖性公司股東人數上限例外，以及技術與勞務出資的同意、章程與比例條件',\n                          '補足短線交易其他股權性質證券、證券商營業處所準用及內線交易非股權公司債路線；90 題同步複核',\n                      ],\n                      'progressImpact': '章節 ID、題目 ID 與題數不變，既有閱讀進度與錯題紀錄保留。',\n                  }],\n              },\n"""
          text = text[:start] + new_block + text[end:]

          text = text.replace("2026.07.29-2", "2026.07.29-3")
          text = text.replace(
              "law_manifest['version'] == law_questions['version'] == '2026.07.28-1'",
              "law_manifest['version'] == law_questions['version'] == '2026.07.29-1'",
          )
          text = text.replace(
              "'commercial_law_version': '2026.07.28-1'",
              "'commercial_law_version': '2026.07.29-1'",
          )

          anchor = "          require_any('證交法第62條', '第62條', '第六十二條')\n"
          if '公開發行公司董事會七日通知' not in text:
              extra = anchor + """          require_any('公開發行股票公司實質董事範圍', '第8條第3項只針對公開發行股票之公司')\n          require_any('已依證交法發行股票公司董事至少五人', '董事會不得少於5人', '董事至少5人')\n          require_any('公開發行公司董事會七日通知', '7日前通知', '七日前通知')\n          require_any('公司法第194條一年持有期間', '繼續1年以上', '繼續一年以上')\n          require_any('短線交易其他股權性質證券', '其他具有股權性質之有價證券')\n          require_any('內線交易非股權公司債', '非股權性質公司債')\n"""
              if anchor not in text:
                  raise SystemExit('legal validator anchor not found')
              text = text.replace(anchor, extra, 1)

          if "'version': '2026.07.29-1'" not in text or "study-library-2026-07-29-3" not in text:
              raise SystemExit('version integration incomplete')
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-pages.yml deploy/patch-commercial-law-reaudit.py
          git commit -m "Correct commercial law after post-publication independent reaudit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
