name: Fix commercial law deployment candidate

on:
  push:
    paths:
      - 'docs/books/commercial-law/fix_candidate_trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize service-worker version in candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/books/commercial-law/deploy-pages-patched-preview.yml')
          text = p.read_text(encoding='utf-8')
          old = 'study-library-2026.07.29-5'
          new = 'study-library-2026-07-29-5'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'unexpected service-worker version occurrence count: {count}')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/books/commercial-law/deploy-pages-patched-preview.yml
          git commit -m "Normalize commercial law candidate service-worker version [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
