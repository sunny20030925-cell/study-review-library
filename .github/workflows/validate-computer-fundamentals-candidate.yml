name: Validate computer fundamentals candidate

on:
  pull_request:
    paths:
      - 'deploy/computer_fundamentals_*.py'
      - 'deploy/generate_computer_fundamentals.py'
      - 'deploy/patch_computer_fundamentals_v2.py'
      - 'deploy/finalize_computer_fundamentals_v2_library.py'
      - 'deploy/qa_computer_fundamentals_v2.py'
      - 'deploy/apply_computer_fundamentals_v2.py'
      - 'docs/books/computer-fundamentals/**'
      - '.github/workflows/validate-computer-fundamentals-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Compile computer fundamentals audit sources
        run: |
          python -m py_compile \
            deploy/computer_fundamentals_content_a.py \
            deploy/computer_fundamentals_content_b.py \
            deploy/computer_fundamentals_questions_a.py \
            deploy/computer_fundamentals_questions_b.py \
            deploy/generate_computer_fundamentals.py \
            deploy/patch_computer_fundamentals_v2.py \
            deploy/finalize_computer_fundamentals_v2_library.py \
            deploy/qa_computer_fundamentals_v2.py \
            deploy/apply_computer_fundamentals_v2.py

      - name: Download latest deployed Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -n 1)"
          test -n "$ARTIFACT_ID"
          echo "BASE_DEPLOY_RUN=$RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/pages.zip
          mkdir /tmp/pages-artifact _site
          unzip -q /tmp/pages.zip -d /tmp/pages-artifact
          if [ -f /tmp/pages-artifact/artifact.tar ]; then
            tar -xf /tmp/pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/pages-artifact/. _site/
          fi
          test -f _site/data/library.json
          test -f _site/books/computer-fundamentals/manifest.json
          test -f _site/sw.js
          test -f _site/app.js

      - name: Apply second-audit correction layer
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('_site/data/library.json'))
          json.dump([b['id'] for b in d['books']],open('/tmp/pre-book-ids.json','w'))
          print('V2_BASE',d['version'],len(d['books']))
          PY
          BEFORE="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
          FINAL_LIBRARY_VERSION="$(PYTHONPATH=deploy python deploy/apply_computer_fundamentals_v2.py _site "$BEFORE")"
          export FINAL_LIBRARY_VERSION
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          PYTHONPATH=deploy python deploy/qa_computer_fundamentals_v2.py _site "$FINAL_LIBRARY_VERSION"
          node --check _site/app.js
          node --check _site/sw.js

      - name: Verify identity, progress compatibility, and tablet assets
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('_site')
          library=json.load(open(site/'data/library.json'))
          pre_ids=json.load(open('/tmp/pre-book-ids.json'))
          ids=[b['id'] for b in library['books']]
          assert ids==pre_ids, (pre_ids,ids)
          assert library['version']==os.environ['FINAL_LIBRARY_VERSION']
          root=site/'books/computer-fundamentals'
          m=json.load(open(root/'manifest.json'))
          q=json.load(open(root/'questions.json'))
          s=json.load(open(root/'search.json'))
          assert m['version']==q['version']=='2026.07.30-2'
          assert len(m['chapters'])==23
          assert q['count']==len(q['items'])==100
          assert len({x['id'] for x in q['items']})==100
          assert len(s['entries'])==150
          for ch in m['chapters']:
              p=root/ch['file']
              assert p.is_file() and p.stat().st_size>500, ch
          figures=list((site/'assets/computer-fundamentals-svg').glob('*.svg'))
          assert len(figures)==20
          assert all(p.stat().st_size>300 for p in figures)
          assert '章節 ID、題目 ID、Book ID、題數與進度儲存鍵均未變' in m['releaseNotes'][0]['progressImpact']
          print('COMPUTER_FUNDAMENTALS_V2_TABLET_AND_IDENTITY_OK',library['version'],len(ids))
          PY
