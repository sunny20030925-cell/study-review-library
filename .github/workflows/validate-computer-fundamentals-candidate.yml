name: Validate computer fundamentals candidate

on:
  pull_request:
    paths:
      - 'deploy/computer_fundamentals_*.py'
      - 'deploy/generate_computer_fundamentals.py'
      - 'deploy/finalize_computer_fundamentals_library.py'
      - 'deploy/validate_computer_fundamentals.py'
      - 'deploy/qa_computer_fundamentals_independent.py'
      - 'docs/books/computer-fundamentals/**'
      - '.github/workflows/validate-computer-fundamentals-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Compile computer fundamentals sources
        run: |
          python -m py_compile \
            deploy/computer_fundamentals_content_a.py \
            deploy/computer_fundamentals_content_b.py \
            deploy/computer_fundamentals_questions_a.py \
            deploy/computer_fundamentals_questions_b.py \
            deploy/generate_computer_fundamentals.py \
            deploy/finalize_computer_fundamentals_library.py \
            deploy/validate_computer_fundamentals.py \
            deploy/qa_computer_fundamentals_independent.py

      - name: Download latest deployed Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -n 1)"
          test -n "$ARTIFACT_ID"
          echo "BASE_DEPLOY_RUN=$RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/pages.zip
          mkdir /tmp/pages-artifact _site
          unzip -q /tmp/pages.zip -d /tmp/pages-artifact
          if [ -f /tmp/pages-artifact/artifact.tar ]; then
            tar -xf /tmp/pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/pages-artifact/. _site/
          fi
          test -f _site/data/library.json
          test -f _site/sw.js
          test -f _site/app.js

      - name: Generate candidate on latest deployed library copy
        run: |
          set -euo pipefail
          cp _site/data/library.json /tmp/pre-computer-fundamentals-library.json
          find _site/books -type f ! -path '*/computer-fundamentals/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-existing-books.sha256
          python deploy/generate_computer_fundamentals.py _site
          FINAL_LIBRARY_VERSION="$(python deploy/finalize_computer_fundamentals_library.py _site /tmp/pre-computer-fundamentals-library.json)"
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "COMPUTER_FUNDAMENTALS_BASE_LIBRARY=$(python -c "import json;print(json.load(open('/tmp/pre-computer-fundamentals-library.json'))['version'])")"
          echo "COMPUTER_FUNDAMENTALS_FINAL_LIBRARY=$FINAL_LIBRARY_VERSION"

      - name: Round 1 structural and integration QA
        run: |
          set -euo pipefail
          EXPECTED_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" PRE_LIBRARY_JSON=/tmp/pre-computer-fundamentals-library.json \
            python deploy/validate_computer_fundamentals.py _site
          find _site/books -type f ! -path '*/computer-fundamentals/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-existing-books.sha256
          diff -u /tmp/pre-existing-books.sha256 /tmp/post-existing-books.sha256
          node --check _site/app.js
          node --check _site/sw.js

      - name: Round 2 independent content QA
        run: |
          set -euo pipefail
          python deploy/qa_computer_fundamentals_independent.py _site

      - name: Verify tablet-facing asset paths exist
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          site = Path('_site')
          root = site/'books/computer-fundamentals'
          m = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert len(m['chapters']) == 23
          for ch in m['chapters']:
              p = root/ch['file']
              assert p.is_file() and p.stat().st_size > 700, ch
          figures = list((site/'assets/computer-fundamentals-svg').glob('*.svg'))
          assert len(figures) == 20
          assert all(p.stat().st_size > 300 for p in figures)
          q = json.loads((root/'questions.json').read_text(encoding='utf-8'))
          s = json.loads((root/'search.json').read_text(encoding='utf-8'))
          assert q['count'] == len(q['items']) == 100
          assert len(s['entries']) == 150
          print('COMPUTER_FUNDAMENTALS_TABLET_ASSET_PATHS_OK')
          PY
