name: Validate game theory candidate

on:
  pull_request:
    paths:
      - 'deploy/game_theory_*.py'
      - 'deploy/generate_game_theory.py'
      - 'deploy/patch_game_theory_v2.py'
      - 'deploy/finalize_game_theory_library.py'
      - 'deploy/finalize_game_theory_v2_library.py'
      - 'deploy/validate_game_theory.py'
      - 'deploy/qa_game_theory_second_pass.py'
      - 'deploy/qa_game_theory_v2.py'
      - 'docs/books/game-theory/**'
      - '.github/workflows/validate-game-theory-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Compile game theory sources
        run: |
          python -m py_compile \
            deploy/game_theory_content_a.py \
            deploy/game_theory_content_b.py \
            deploy/game_theory_questions_a.py \
            deploy/game_theory_questions_b.py \
            deploy/generate_game_theory.py \
            deploy/patch_game_theory_v2.py \
            deploy/finalize_game_theory_library.py \
            deploy/finalize_game_theory_v2_library.py \
            deploy/validate_game_theory.py \
            deploy/qa_game_theory_second_pass.py \
            deploy/qa_game_theory_v2.py

      - name: Download latest formal Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_id'])")"
          ARTIFACT_DIGEST="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_digest'])")"
          RECEIPT_LIBRARY="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['library_version'])")"
          RECEIPT_BOOKS="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['book_count'])")"
          EXPECTED_SHA="${ARTIFACT_DIGEST#sha256:}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/pages.zip
          echo "${EXPECTED_SHA}  /tmp/pages.zip" | sha256sum --check -
          mkdir /tmp/pages-artifact _site
          unzip -q /tmp/pages.zip -d /tmp/pages-artifact
          if [ -f /tmp/pages-artifact/artifact.tar ]; then
            tar -xf /tmp/pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/pages-artifact/. _site/
          fi
          RECEIPT_LIBRARY="$RECEIPT_LIBRARY" RECEIPT_BOOKS="$RECEIPT_BOOKS" python - <<'PY'
          import json, os
          from pathlib import Path
          site=Path('_site')
          lib=json.loads((site/'data/library.json').read_text(encoding='utf-8'))
          ids=[b['id'] for b in lib['books']]
          assert lib['version']==os.environ['RECEIPT_LIBRARY'], (lib['version'],os.environ['RECEIPT_LIBRARY'])
          assert len(ids)==int(os.environ['RECEIPT_BOOKS']), ids
          assert ids.count('game-theory')==1, ids
          m=json.loads((site/'books/game-theory/manifest.json').read_text(encoding='utf-8'))
          assert m['version'] in {'2026.07.29-1','2026.07.30-2'}, m['version']
          print(f"FORMAL_GAME_THEORY_V2_BASE_OK books={len(ids)} library={lib['version']} content={m['version']}")
          PY

      - name: Patch isolated formal artifact to game theory v2
        run: |
          set -euo pipefail
          BEFORE="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
          echo "BEFORE_LIBRARY_VERSION=$BEFORE" >> "$GITHUB_ENV"
          find _site/books -type f ! -path '_site/books/game-theory/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-other-books.sha256
          sha256sum _site/app.js > /tmp/pre-app.sha256
          python deploy/patch_game_theory_v2.py _site
          FINAL_LIBRARY_VERSION="$(python deploy/finalize_game_theory_v2_library.py _site "$BEFORE" | tail -n 1)"
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "GAME_THEORY_V2_FINAL_LIBRARY=$FINAL_LIBRARY_VERSION"

      - name: Independent v2 content and preservation validation
        run: |
          set -euo pipefail
          python deploy/qa_game_theory_v2.py _site "$FINAL_LIBRARY_VERSION"
          python deploy/qa_game_theory_second_pass.py
          find _site/books -type f ! -path '_site/books/game-theory/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-other-books.sha256
          sha256sum _site/app.js > /tmp/post-app.sha256
          diff -u /tmp/pre-other-books.sha256 /tmp/post-other-books.sha256
          diff -u /tmp/pre-app.sha256 /tmp/post-app.sha256
          node --check _site/app.js
          node --check _site/sw.js

      - name: Verify v2 tablet-facing assets
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          site=Path('_site')
          lib=json.loads((site/'data/library.json').read_text(encoding='utf-8'))
          m=json.loads((site/'books/game-theory/manifest.json').read_text(encoding='utf-8'))
          q=json.loads((site/'books/game-theory/questions.json').read_text(encoding='utf-8'))
          s=json.loads((site/'books/game-theory/search.json').read_text(encoding='utf-8'))
          assert lib['version']==os.environ['FINAL_LIBRARY_VERSION']
          assert m['version']==q['version']=='2026.07.30-2'
          for ch in m['chapters']:
              p=site/'books/game-theory'/ch['file']
              assert p.is_file() and p.stat().st_size>700, ch
          figures=list((site/'assets/game-theory-svg').glob('*.svg'))
          assert len(m['chapters'])==23
          assert len(figures)==20 and all(p.stat().st_size>300 for p in figures)
          assert len(q['items'])==100
          assert len(s['entries'])==189
          print('GAME_THEORY_V2_TABLET_ASSETS_OK chapters=23 questions=100 search=189 figures=20')
          PY
