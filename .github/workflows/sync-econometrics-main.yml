name: Sync econometrics candidate with main

on:
  push:
    branches:
      - book-econometrics
    paths:
      - '.github/workflows/sync-econometrics-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: book-econometrics
          fetch-depth: 0

      - name: Merge latest main and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/sync-econometrics-main.yml
          git commit -m 'Sync econometrics candidate with latest main'
          git push origin HEAD:book-econometrics
