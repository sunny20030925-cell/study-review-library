name: Diagnose study library workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix and validate canonical workflow syntax
        run: |
          python deploy/fix_microeconomics_workflow_yaml.py .github/workflows/deploy-pages.yml deploy/generated-deploy-pages.microeconomics-fixed.yml
          ruby -e "require 'yaml'; YAML.parse_file('deploy/generated-deploy-pages.microeconomics-fixed.yml'); puts 'CANONICAL_YAML_PARSE_OK'"
          grep -F 'Generate and independently validate microeconomics textbook' deploy/generated-deploy-pages.microeconomics-fixed.yml
          grep -F "'microeconomics_round1_check_count': 1321" deploy/generated-deploy-pages.microeconomics-fixed.yml
          grep -F 'git add docs/deployment_receipt.json README.md docs/shared_checkpoint.md docs/books/microeconomics/status.md' deploy/generated-deploy-pages.microeconomics-fixed.yml
          echo 'CANONICAL_MICRO_MARKERS_OK'
      - name: Stage validated canonical workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/generated-deploy-pages.microeconomics-fixed.yml
          if git diff --cached --quiet; then
            echo 'Fixed workflow staging file already exists.'
            exit 0
          fi
          git commit -m 'Stage syntax-fixed microeconomics canonical workflow [skip ci]'
          git push origin HEAD:main
