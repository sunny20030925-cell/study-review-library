name: Stage nine-book canonical on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  stage:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'stage-nine-book-canonical-v3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled staging branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Generate and verify nine-book canonical workflow
        run: |
          python -m py_compile deploy/integrate_intermediate_accounting_workflow.py deploy/integrate_macroeconomics_workflow.py
          python deploy/integrate_intermediate_accounting_workflow.py
          ruby -e "require 'yaml'; YAML.load_file('deploy/generated-deploy-pages.intermediate-accounting.yml'); puts 'INTERMEDIATE_YAML_OK'"
          cp deploy/generated-deploy-pages.intermediate-accounting.yml .github/workflows/deploy-pages.yml
          python deploy/integrate_macroeconomics_workflow.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy-pages.yml'); puts 'NINE_BOOK_YAML_OK'"
          grep -F "Generate and independently validate intermediate accounting textbook" .github/workflows/deploy-pages.yml
          grep -F "Generate and independently validate macroeconomics textbook" .github/workflows/deploy-pages.yml
          grep -F "'intermediate_accounting_version': '2026.07.29-1'" .github/workflows/deploy-pages.yml
          grep -F "'macroeconomics_version': '2026.07.29-1'" .github/workflows/deploy-pages.yml
          grep -F "docs/books/intermediate-accounting/status.md docs/books/macroeconomics/status.md" .github/workflows/deploy-pages.yml

      - name: Upload validated canonical workflow
        uses: actions/upload-artifact@v4
        with:
          name: nine-book-canonical-${{ github.run_id }}
          path: .github/workflows/deploy-pages.yml
          if-no-files-found: error
          retention-days: 1
