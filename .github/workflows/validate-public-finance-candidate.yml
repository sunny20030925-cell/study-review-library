name: Validate public finance candidate

on:
  pull_request:
    paths:
      - 'deploy/public_finance_*.py'
      - 'deploy/generate_public_finance.py'
      - 'deploy/finalize_public_finance_library.py'
      - 'deploy/validate_public_finance.py'
      - 'deploy/integrate_public_finance.py'
      - 'deploy/qa_public_finance_v2.py'
      - 'deploy/finalize_macroeconomics_v2_library.py'
      - 'deploy/qa_macroeconomics_v2.py'
      - 'docs/books/public-finance/**'
      - '.github/workflows/validate-public-finance-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Compile public finance v2 canonical tail
        run: |
          python -m py_compile \
            deploy/public_finance_content_a.py \
            deploy/public_finance_content_b.py \
            deploy/public_finance_questions_a.py \
            deploy/public_finance_questions_b.py \
            deploy/public_finance_v2_corrections.py \
            deploy/generate_public_finance.py \
            deploy/finalize_public_finance_library.py \
            deploy/validate_public_finance.py \
            deploy/qa_public_finance_v2.py \
            deploy/integrate_public_finance.py \
            deploy/finalize_macroeconomics_v2_library.py \
            deploy/qa_macroeconomics_v2.py

      - name: Download canonical ten-book pre-public-finance artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_DEPLOY_RUN: '30442682452'
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_DEPLOY_RUN}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -n 1)"
          test -n "$ARTIFACT_ID"
          echo "BASE_DEPLOY_RUN=$BASE_DEPLOY_RUN"
          echo "BASE_ARTIFACT_ID=$ARTIFACT_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/pages.zip
          mkdir /tmp/pages-artifact _site
          unzip -q /tmp/pages.zip -d /tmp/pages-artifact
          if [ -f /tmp/pages-artifact/artifact.tar ]; then
            tar -xf /tmp/pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/pages-artifact/. _site/
          fi
          test -f _site/data/library.json
          test -f _site/sw.js
          test -f _site/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          lib=json.loads(Path('_site/data/library.json').read_text(encoding='utf-8'))
          ids=[b['id'] for b in lib['books']]
          assert len(ids)==10, ids
          assert ids[-2:]==['macroeconomics','international-economics'], ids
          assert 'public-finance' not in ids, ids
          assert lib['version']=='2026.07.29-13', lib['version']
          print(f"CANONICAL_PRE_PUBLIC_FINANCE_BASE_OK books={len(ids)} library={lib['version']} tail={ids[-2:]}")
          PY

      - name: Run public finance v2 canonical-tail preflight
        run: |
          set -euo pipefail
          cp _site/data/library.json /tmp/pre-public-finance-library.json
          find _site/books -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-existing-books.sha256
          BASE_LIBRARY_VERSION="$(python -c "import json;print(json.load(open('/tmp/pre-public-finance-library.json'))['version'])")"
          FINAL_LIBRARY_VERSION="$(python deploy/integrate_public_finance.py _site "$BASE_LIBRARY_VERSION")"
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "PUBLIC_FINANCE_BASE_LIBRARY=$BASE_LIBRARY_VERSION"
          echo "PUBLIC_FINANCE_FINAL_LIBRARY=$FINAL_LIBRARY_VERSION"
          test "$FINAL_LIBRARY_VERSION" = '2026.07.29-15'

      - name: Independent v2 content, tail-order, and preservation validation
        run: |
          set -euo pipefail
          python deploy/qa_public_finance_v2.py _site "$FINAL_LIBRARY_VERSION"
          python deploy/qa_macroeconomics_v2.py _site "$FINAL_LIBRARY_VERSION"
          find _site/books -type f ! -path '*/public-finance/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-existing-books.sha256
          diff -u /tmp/pre-existing-books.sha256 /tmp/post-existing-books.sha256
          node --check _site/app.js
          node --check _site/sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          site=Path('_site')
          lib=json.loads((site/'data/library.json').read_text(encoding='utf-8'))
          ids=[b['id'] for b in lib['books']]
          pf=json.loads((site/'books/public-finance/manifest.json').read_text(encoding='utf-8'))
          q=json.loads((site/'books/public-finance/questions.json').read_text(encoding='utf-8'))
          assert lib['version']=='2026.07.29-15', lib['version']
          assert len(ids)==11, ids
          assert ids[-3:]==['macroeconomics','international-economics','public-finance'], ids
          assert pf['version']=='2026.07.29-2', pf['version']
          assert q['version']=='2026.07.29-2', q['version']
          assert len(q['items'])==100
          print(f"PUBLIC_FINANCE_V2_CANONICAL_TAIL_OK books={len(ids)} library={lib['version']} book={pf['version']} tail={ids[-3:]}")
          PY

      - name: Verify tablet-facing asset paths exist
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          site = Path('_site')
          m = json.loads((site/'books/public-finance/manifest.json').read_text(encoding='utf-8'))
          for ch in m['chapters']:
              p = site/'books/public-finance'/ch['file']
              assert p.is_file() and p.stat().st_size > 700, ch
          for p in (site/'assets/public-finance-svg').glob('*.svg'):
              assert p.stat().st_size > 300, p
          assert len(list((site/'assets/public-finance-svg').glob('*.svg'))) == 20
          print('PUBLIC_FINANCE_V2_TABLET_ASSET_PATHS_OK')
          PY
