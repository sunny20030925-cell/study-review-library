name: Validate macroeconomics integration

on:
  pull_request:
    paths:
      - .github/workflows/validate-macroeconomics-integration.yml
      - .github/workflows/integrate-pending-economics-books.yml
      - deploy/integrate_macroeconomics_workflow.py
      - deploy/finalize_macroeconomics_library.py
      - deploy/validate_macroeconomics.py
      - deploy/generate-macroeconomics.py.gz.b64.part00
      - deploy/generate-macroeconomics.py.gz.b64.part01

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate the proposed canonical workflow
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
          git show origin/main:deploy/integrate_intermediate_accounting_workflow.py > /tmp/integrate_intermediate_accounting_workflow.py
          python -m py_compile deploy/finalize_macroeconomics_library.py deploy/validate_macroeconomics.py deploy/integrate_macroeconomics_workflow.py /tmp/integrate_intermediate_accounting_workflow.py
          python /tmp/integrate_intermediate_accounting_workflow.py
          cp deploy/generated-deploy-pages.intermediate-accounting.yml .github/workflows/deploy-pages.yml
          python deploy/integrate_macroeconomics_workflow.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy-pages.yml'); puts 'YAML_OK'"
          grep -F "Generate and independently validate intermediate accounting textbook" .github/workflows/deploy-pages.yml
          grep -F "Generate and independently validate macroeconomics textbook" .github/workflows/deploy-pages.yml
          grep -F "docs/books/intermediate-accounting/status.md docs/books/macroeconomics/status.md" .github/workflows/deploy-pages.yml
