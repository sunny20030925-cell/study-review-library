name: Activate mathematical economics v2 stage

on:
  pull_request:
    paths:
      - '.github/workflows/activate-mathematical-economics-v2-stage.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build validated canonical workflow from latest main
        run: |
          set -euo pipefail
          git fetch origin main activate-math-econ-v2-stage
          git checkout -B stage-main origin/main
          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"
          python -m py_compile deploy/stage_mathematical_economics_v2_release.py
          python deploy/stage_mathematical_economics_v2_release.py
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml').read_text()
          assert p.count('Integrate mathematical economics v2 audited release')==1
          assert p.count('record_mathematical_economics_v2_deployment.py')>=2
          assert "ids[-2:]==['industry-trade','mathematical-economics']" in p
          assert 'MATHEMATICAL_ECONOMICS_V2_QA_CHECKS' in p
          print('MATHEMATICAL_ECONOMICS_V2_MAIN_STAGE_READY')
          PY
          git diff --check
          cp .github/workflows/deploy-pages.yml /tmp/math-econ-deploy-pages.yml

          git checkout -B activate-math-econ-v2-stage origin/activate-math-econ-v2-stage
          mkdir -p staged
          cp /tmp/math-econ-deploy-pages.yml staged/mathematical-economics-v2-deploy-pages.yml
          printf '%s\n' "$BASE_SHA" > staged/mathematical-economics-v2-base-sha.txt
          printf '%s\n' "$BASE_TREE" > staged/mathematical-economics-v2-base-tree-sha.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add staged/mathematical-economics-v2-deploy-pages.yml staged/mathematical-economics-v2-base-sha.txt staged/mathematical-economics-v2-base-tree-sha.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Store validated mathematical economics v2 workflow blob'
            git push origin HEAD:activate-math-econ-v2-stage
          fi
          echo "MATHEMATICAL_ECONOMICS_V2_BASE_SHA=$BASE_SHA"
          echo "MATHEMATICAL_ECONOMICS_V2_BASE_TREE=$BASE_TREE"
