name: Record statistics reaudit workflow

on:
  workflow_run:
    workflows: ["Apply statistics independent reaudit corrections"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record workflow result
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              'workflow': 'Apply statistics independent reaudit corrections',
              'conclusion': os.environ['SOURCE_CONCLUSION'],
              'workflow_run_id': os.environ['SOURCE_RUN_ID'],
              'source_commit': os.environ['SOURCE_HEAD_SHA'],
              'workflow_url': os.environ['SOURCE_HTML_URL'],
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('docs/statistics_reaudit_workflow_receipt.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/statistics_reaudit_workflow_receipt.json
          git commit -m "Record statistics reaudit workflow result [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
