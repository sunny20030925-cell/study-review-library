name: Audit commercial law content snapshot

on:
  push:
    paths:
      - 'docs/books/commercial-law/run_content_reaudit.txt'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build current five-book site through commercial-law generation
        run: |
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20 \
            'https://drive.usercontent.google.com/download?id=1rgPS62bIZOWC8H3zSrw-RBZ3jkg9SDcs&export=download&confirm=t' \
            -o site.zip
          echo 'ece2a68f5bdaf7fd82c3897bf49a9628121e9775f6b75ee7d7b375c1bbe01600  site.zip' | sha256sum --check -
          mkdir _site
          python -m zipfile -e site.zip _site
          rm -rf _site/.github
          python -m pip install --disable-pip-version-check beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          path = Path('_site/sw.js')
          text = path.read_text(encoding='utf-8')
          current = "const VERSION = 'study-library-2026-07-28-1';"
          expected = "const VERSION = 'study-library-2026-07-27-5';"
          if current in text:
              text = text.replace(current, expected, 1)
              path.write_text(text, encoding='utf-8')
          elif expected not in text:
              raise AssertionError('unexpected service worker version before accounting patch')
          PY
          python deploy/patch_accounting_v2.py _site
          cat deploy/patch-economics-v2.py.gz.b64.part* | base64 --decode > /tmp/patch-economics-v2.py.gz
          echo 'b675b23d8711c75b2d736315b3161d5c2afc608d11e55249ec9ea5bd1e4d97fa  /tmp/patch-economics-v2.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/patch-economics-v2.py.gz > /tmp/patch-economics-v2.py
          SITE_ROOT="$GITHUB_WORKSPACE/_site" python /tmp/patch-economics-v2.py
          cat deploy/generate-commercial-law.py.gz.b64.part* | base64 --decode > /tmp/generate-commercial-law.py.gz
          echo '85843044d6fee2f0c5d11208754a4d6b103402392d3a44511745a146874dcdfc  /tmp/generate-commercial-law.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/generate-commercial-law.py.gz > /tmp/generate-commercial-law.py
          python /tmp/generate-commercial-law.py _site

      - name: Export reviewable snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from bs4 import BeautifulSoup

          root = Path('_site/books/commercial-law')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          questions = json.loads((root / 'questions.json').read_text(encoding='utf-8'))
          search = json.loads((root / 'search.json').read_text(encoding='utf-8'))
          out = []
          out.append('# Commercial law deployed-content audit snapshot')
          out.append('')
          out.append(f"version: {manifest.get('version')}")
          out.append(f"chapters: {len(manifest.get('chapters', []))}")
          out.append(f"questions: {len(questions.get('items', []))}")
          out.append(f"search_entries: {len(search.get('entries', []))}")
          out.append('')
          out.append('## CHAPTERS AND APPENDICES')
          out.append('')
          for ch in manifest['chapters']:
              html = (root / ch['file']).read_text(encoding='utf-8')
              soup = BeautifulSoup(html, 'html.parser')
              text = soup.get_text('\n', strip=True)
              out.append(f"### {ch['id']} | {ch.get('kind')} | {ch.get('title')}")
              out.append('')
              out.extend(text.splitlines())
              out.append('')
          out.append('## QUESTIONS')
          out.append('')
          for q in questions['items']:
              out.append(f"### {q.get('id')} | chapter={q.get('chapterId')}")
              for key in ('type','prompt','stem','question'):
                  if q.get(key): out.append(f"{key}: {q[key]}")
              opts = q.get('options')
              if isinstance(opts, list):
                  for i, opt in enumerate(opts): out.append(f"option[{i}]: {opt}")
              elif isinstance(opts, dict):
                  for k, opt in opts.items(): out.append(f"option[{k}]: {opt}")
              for key in ('answer','correct','explanation','rationale','solution'):
                  if q.get(key) is not None: out.append(f"{key}: {q[key]}")
              out.append('')
          out.append('## SEARCH ENTRIES')
          out.append('')
          for e in search['entries']:
              out.append(json.dumps(e, ensure_ascii=False, sort_keys=True))
          Path('docs/books/commercial-law/audit_snapshot.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Commit snapshot for independent review
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git rebase origin/main
          git add docs/books/commercial-law/audit_snapshot.md
          git commit -m "Export commercial law content for independent reaudit [skip ci]"
          git push origin HEAD:main
