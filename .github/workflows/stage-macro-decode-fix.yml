name: Stage rebuilt macroeconomics canonical workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  stage:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'stage-final-macroeconomics-canonical'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled staging branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Rebuild payload and stage canonical workflow
        run: |
          python -m py_compile deploy/stage_final_macroeconomics.py
          python deploy/stage_final_macroeconomics.py
          cat deploy/generate-macroeconomics.py.gz.b64.part* | tr -d '\n\r\t ' | base64 --decode > /tmp/generate-macroeconomics.py.gz
          echo 'c3643675f863883a429d492334b291d430ebfa87bf0b1cbf49806dfe790b6b34  /tmp/generate-macroeconomics.py.gz' | sha256sum --check -
          gzip --test /tmp/generate-macroeconomics.py.gz
          gzip --decompress --stdout /tmp/generate-macroeconomics.py.gz > /tmp/generate-macroeconomics.py
          python -m py_compile /tmp/generate-macroeconomics.py
          ruby -e "require 'yaml'; YAML.load_file('deploy/staged-final-macroeconomics-deploy-pages.yml'); puts 'FINAL_MACRO_YAML_OK'"
          grep -F 'Generate and independently validate macroeconomics textbook' deploy/staged-final-macroeconomics-deploy-pages.yml
          grep -F "'macroeconomics_question_count': 100" deploy/staged-final-macroeconomics-deploy-pages.yml
          grep -F "Path('docs/books/macroeconomics/status.md')" deploy/staged-final-macroeconomics-deploy-pages.yml
          ! grep -F 'Note deferred macroeconomics deployment' deploy/staged-final-macroeconomics-deploy-pages.yml

      - name: Commit rebuilt payload and canonical blob
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/generate-macroeconomics.py.gz.b64.part00 deploy/generate-macroeconomics.py.gz.b64.part01 deploy/staged-final-macroeconomics-deploy-pages.yml
          git rm deploy/rebuilt-macroeconomics.b64.chunk* deploy/stage_final_macroeconomics.py
          git commit -m "Stage rebuilt macroeconomics payload and canonical workflow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
