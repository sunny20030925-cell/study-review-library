name: Apply commercial law independent reaudit corrections

on:
  push:
    paths:
      - 'docs/books/commercial-law/apply_content_reaudit.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate and verify corrected commercial-law content
        run: |
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20 \
            'https://drive.usercontent.google.com/download?id=1rgPS62bIZOWC8H3zSrw-RBZ3jkg9SDcs&export=download&confirm=t' \
            -o site.zip
          echo 'ece2a68f5bdaf7fd82c3897bf49a9628121e9775f6b75ee7d7b375c1bbe01600  site.zip' | sha256sum --check -
          mkdir _site
          python -m zipfile -e site.zip _site
          rm -rf _site/.github
          python -m pip install --disable-pip-version-check beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          path = Path('_site/sw.js')
          text = path.read_text(encoding='utf-8')
          current = "const VERSION = 'study-library-2026-07-28-1';"
          expected = "const VERSION = 'study-library-2026-07-27-5';"
          if current in text:
              text = text.replace(current, expected, 1)
              path.write_text(text, encoding='utf-8')
          elif expected not in text:
              raise AssertionError('unexpected service worker version before accounting patch')
          PY
          python deploy/patch_accounting_v2.py _site
          cat deploy/patch-economics-v2.py.gz.b64.part* | base64 --decode > /tmp/patch-economics-v2.py.gz
          echo 'b675b23d8711c75b2d736315b3161d5c2afc608d11e55249ec9ea5bd1e4d97fa  /tmp/patch-economics-v2.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/patch-economics-v2.py.gz > /tmp/patch-economics-v2.py
          SITE_ROOT="$GITHUB_WORKSPACE/_site" python /tmp/patch-economics-v2.py
          cat deploy/generate-commercial-law.py.gz.b64.part* | base64 --decode > /tmp/generate-commercial-law.py.gz
          echo '85843044d6fee2f0c5d11208754a4d6b103402392d3a44511745a146874dcdfc  /tmp/generate-commercial-law.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/generate-commercial-law.py.gz > /tmp/generate-commercial-law.py
          python /tmp/generate-commercial-law.py _site
          python deploy/patch-commercial-law-reaudit.py _site

      - name: Record corrected-content verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          from collections import Counter
          root = Path('_site/books/commercial-law')
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          questions = json.loads((root/'questions.json').read_text(encoding='utf-8'))
          search = json.loads((root/'search.json').read_text(encoding='utf-8'))
          html = '\n'.join((root/ch['file']).read_text(encoding='utf-8') for ch in manifest['chapters'])
          plain = re.sub(r'<[^>]+>', ' ', html)
          checks = {
              'version': manifest['version'] == questions['version'] == '2026.07.29-1',
              'chapters': len([x for x in manifest['chapters'] if x['kind']=='chapter']) == 18,
              'appendices': len([x for x in manifest['chapters'] if x['kind']=='appendix']) == 3,
              'questions': len(questions['items']) == 90,
              'five_questions_each': Counter(q['chapterId'] for q in questions['items']) == {f'ch{i:02d}':5 for i in range(18)},
              'search_entries': len(search['entries']) == 111,
              'art8_scope': '第 8 條第 3 項只針對公開發行股票之公司' in plain,
              'board_five': '董事會不得少於 5 人' in plain,
              'board_notice_seven': '原則於 7 日前通知' in plain,
              'interested_director_vote': '不得加入表決' in plain and '不算入已出席董事的表決權數' in plain,
              'art194_one_year': '繼續 1 年以上' in plain,
              'close_company_caveat': '中央主管機關得視社會經濟情況及實際需要增加股東人數上限' in plain,
              'short_swing_equity_security': '其他具有股權性質之有價證券' in plain,
              'insider_bond_route': '非股權性質公司債' in plain,
          }
          if not all(checks.values()):
              raise AssertionError({k:v for k,v in checks.items() if not v})
          payload = {
              'commercial_law_version': '2026.07.29-1',
              'chapter_count': 18,
              'appendix_count': 3,
              'question_count': 90,
              'search_count': 111,
              'checks': checks,
              'updated_question_ids': ['ch02-q05','ch07-q01','ch07-q04','ch08-q05','ch10-q01','ch16-q04'],
          }
          Path('docs/books/commercial-law/reaudit_verification.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('REAUDIT_VERIFICATION_OK')
          PY

      - name: Integrate corrections into canonical five-book deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-pages.yml')
          text = p.read_text(encoding='utf-8')

          generator_line = "          python /tmp/generate-commercial-law.py _site\n"
          patch_step = """          python /tmp/generate-commercial-law.py _site\n\n      - name: Apply commercial law post-publication corrections\n        run: |\n          python deploy/patch-commercial-law-reaudit.py _site\n"""
          if 'Apply commercial law post-publication corrections' not in text:
              if generator_line not in text:
                  raise SystemExit('commercial law generator hook not found')
              text = text.replace(generator_line, patch_step, 1)

          old_release = """              'commercial-law': {\n                  'updatedAt': '2026-07-29',\n                  'releaseNotes': [{\n                      'version': '2026.07.28-1',\n                      'date': '2026-07-29',\n                      'title': '新增商事法重點整理',\n                      'changes': [\n                          '以公司法與證券交易法為核心，新增 18 章正文與 3 份附錄',\n                          '新增 90 題題庫，每章 5 題，涵蓋法條、要件、責任、程序與常見陷阱',\n                          '新增 111 筆搜尋索引、18 張自製圖解與法條速查功能',\n                          '完成兩輪內容與題庫 QA，並複核重要門檻、期間與責任規則',\n                      ],\n                      'progressImpact': '新增獨立書籍，不改動既有書籍的章節、題目 ID 或閱讀進度。',\n                  }],\n              },\n"""
          new_release = """              'commercial-law': {\n                  'updatedAt': '2026-07-29',\n                  'releaseNotes': [{\n                      'version': '2026.07.29-1',\n                      'date': '2026-07-29',\n                      'title': '發布後獨立內容複核與法律精確化',\n                      'changes': [\n                          '限縮公司法第 8 條實質董事規則至公開發行股票之公司，補正第 194 條繼續持股 1 年門檻',\n                          '補入已依證交法發行股票公司董事至少 5 人、公開發行公司董事會原則 7 日前通知與利害關係董事表決排除',\n                          '補正閉鎖性公司股東人數上限例外，以及技術與勞務出資的同意、章程與比例條件',\n                          '補足短線交易其他股權性質證券、證券商營業處所準用及內線交易非股權公司債路線；90 題同步複核',\n                      ],\n                      'progressImpact': '章節 ID、題目 ID 與題數不變，既有閱讀進度與錯題紀錄保留。',\n                  }],\n              },\n"""
          if old_release not in text and new_release not in text:
              raise SystemExit('commercial law release block not found')
          text = text.replace(old_release, new_release, 1)

          text = text.replace("library['version'] = '2026.07.29-2'", "library['version'] = '2026.07.29-3'")
          text = text.replace("study-library-2026-07-29-2", "study-library-2026-07-29-3")
          text = text.replace("assert library['version'] == '2026.07.29-2'", "assert library['version'] == '2026.07.29-3'")
          text = text.replace("law_manifest['version'] == law_questions['version'] == '2026.07.28-1'", "law_manifest['version'] == law_questions['version'] == '2026.07.29-1'")
          text = text.replace("'library_version': '2026.07.29-2'", "'library_version': '2026.07.29-3'")
          text = text.replace("'commercial_law_version': '2026.07.28-1'", "'commercial_law_version': '2026.07.29-1'")

          anchor = "          require_any('證交法第62條', '第62條', '第六十二條')\n"
          extra = """          require_any('證交法第62條', '第62條', '第六十二條')\n          require_any('公開發行股票公司實質董事範圍', '第8條第3項只針對公開發行股票之公司')\n          require_any('已依證交法發行股票公司董事至少五人', '董事會不得少於5人', '董事至少5人')\n          require_any('公開發行公司董事會七日通知', '7日前通知', '七日前通知')\n          require_any('公司法第194條一年持有期間', '繼續1年以上', '繼續一年以上')\n          require_any('短線交易其他股權性質證券', '其他具有股權性質之有價證券')\n          require_any('內線交易非股權公司債', '非股權性質公司債')\n"""
          if '公開發行公司董事會七日通知' not in text:
              if anchor not in text:
                  raise SystemExit('legal fact validation anchor not found')
              text = text.replace(anchor, extra, 1)

          p.write_text(text, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/patch-commercial-law-reaudit.py .github/workflows/deploy-pages.yml docs/books/commercial-law/reaudit_verification.json
          git commit -m "Correct commercial law after post-publication independent reaudit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
