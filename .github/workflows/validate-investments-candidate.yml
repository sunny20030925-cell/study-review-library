name: Validate investments candidate

on:
  pull_request:
    paths:
      - 'deploy/investments-src.tar.xz.b64.part*'
      - 'docs/books/investments/**'
      - '.github/workflows/validate-investments-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Decode and compile investments sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/investments-src
          cat deploy/investments-src.tar.xz.b64.part* | tr -d '\n\r\t ' | base64 --decode > /tmp/investments-src.tar.xz
          echo '5507e92996f4793437517d5c43fd25f2a11c1e5c352f90d3e2de7607852a2d4f  /tmp/investments-src.tar.xz' | sha256sum --check -
          xz --test /tmp/investments-src.tar.xz
          tar -xJf /tmp/investments-src.tar.xz -C /tmp/investments-src
          python -m py_compile /tmp/investments-src/*.py

      - name: Download newest deployed Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=''
          ARTIFACT_ID=''
          for candidate in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/runs?branch=main&per_page=30" --jq '.workflow_runs[].id'); do
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | head -n 1)"
            if [ -n "$artifact" ]; then
              RUN_ID="$candidate"
              ARTIFACT_ID="$artifact"
              break
            fi
          done
          test -n "$RUN_ID"
          test -n "$ARTIFACT_ID"
          echo "BASE_DEPLOY_RUN=$RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/pages.zip
          mkdir /tmp/pages-artifact _site
          unzip -q /tmp/pages.zip -d /tmp/pages-artifact
          if [ -f /tmp/pages-artifact/artifact.tar ]; then
            tar -xf /tmp/pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/pages-artifact/. _site/
          fi
          test -f _site/data/library.json
          test -f _site/sw.js
          test -f _site/app.js

      - name: Integrate on latest deployed library copy
        run: |
          set -euo pipefail
          find _site/books -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-existing-books.sha256
          BASE_LIBRARY_VERSION="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
          PRE_BOOK_COUNT="$(python -c "import json;print(len(json.load(open('_site/data/library.json'))['books']))")"
          FINAL_LIBRARY_VERSION="$(PYTHONPATH=/tmp/investments-src python /tmp/investments-src/integrate_investments.py _site "$BASE_LIBRARY_VERSION")"
          echo "BASE_LIBRARY_VERSION=$BASE_LIBRARY_VERSION"
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION"
          echo "PRE_BOOK_COUNT=$PRE_BOOK_COUNT"
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "PRE_BOOK_COUNT=$PRE_BOOK_COUNT" >> "$GITHUB_ENV"

      - name: Independent content, preservation and tablet validation
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/investments-src python /tmp/investments-src/validate_investments.py _site "$FINAL_LIBRARY_VERSION"
          PYTHONPATH=/tmp/investments-src python /tmp/investments-src/qa_investments_round2.py _site "$FINAL_LIBRARY_VERSION"
          find _site/books -type f ! -path '*/investments/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-existing-books.sha256
          diff -u /tmp/pre-existing-books.sha256 /tmp/post-existing-books.sha256
          node --check _site/app.js
          node --check _site/sw.js
          python - <<'PY'
          import json, os
          from pathlib import Path
          site=Path('_site')
          lib=json.loads((site/'data/library.json').read_text(encoding='utf-8'))
          ids=[b['id'] for b in lib['books']]
          assert ids[-1]=='investments', ids
          assert len(ids)==int(os.environ['PRE_BOOK_COUNT'])+1, ids
          m=json.loads((site/'books/investments/manifest.json').read_text(encoding='utf-8'))
          q=json.loads((site/'books/investments/questions.json').read_text(encoding='utf-8'))
          s=json.loads((site/'books/investments/search.json').read_text(encoding='utf-8'))
          assert len([x for x in m['chapters'] if x['kind']=='chapter'])==22
          assert len([x for x in m['chapters'] if x['kind']=='appendix'])==3
          assert q['count']==110 and len(q['items'])==110
          assert len(s['entries'])==165
          figures=list((site/'assets/investments-svg').glob('*.svg'))
          assert len(figures)==22
          print(f"INVESTMENTS_CANDIDATE_OK books={len(ids)} library={lib['version']} questions={q['count']} search={len(s['entries'])} figures={len(figures)}")
          PY
