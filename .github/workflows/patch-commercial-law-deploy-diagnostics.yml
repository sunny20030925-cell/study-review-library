name: Patch commercial law deploy diagnostics

on:
  push:
    paths:
      - '.github/workflows/patch-commercial-law-deploy-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Improve download retry and validation diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-commercial-law.yml')
          text = path.read_text(encoding='utf-8')
          old = "curl -L --fail --retry 3 \\\n"
          new = "curl -L --fail --retry 8 --retry-all-errors --connect-timeout 20 \\\n"
          if old not in text:
              raise SystemExit('curl pattern not found')
          text = text.replace(old, new, 1)
          old_assert = "              assert token in law_text\n"
          new_assert = "              assert token in law_text, f'missing required token: {token}'\n"
          if old_assert not in text:
              raise SystemExit('token assertion pattern not found')
          text = text.replace(old_assert, new_assert, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-commercial-law.yml
          git diff --cached --quiet && exit 0
          git commit -m "Improve commercial law deployment diagnostics"
          git push origin HEAD:main

