name: Trigger corrected commercial law deployment

on:
  push:
    paths:
      - '.github/workflows/patch-commercial-law-deploy-diagnostics.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch commercial law deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-commercial-law.yml --repo "$GITHUB_REPOSITORY" --ref main

