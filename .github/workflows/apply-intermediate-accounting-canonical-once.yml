name: Stage intermediate accounting canonical workflow for PR

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-intermediate-accounting-canonical-once.yml
      - deploy/integrate_intermediate_accounting_workflow.py

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated integration branch
        uses: actions/checkout@v4
        with:
          ref: stage-intermediate-canonical-pr
          fetch-depth: 0

      - name: Generate and verify canonical workflow from latest main
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
          python deploy/integrate_intermediate_accounting_workflow.py
          mv deploy/generated-deploy-pages.intermediate-accounting.yml .github/workflows/deploy-pages.yml
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy-pages.yml'); puts 'YAML_OK'"
          grep -F "Generate and independently validate intermediate accounting textbook" .github/workflows/deploy-pages.yml
          grep -F "'intermediate_accounting_version': '2026.07.29-1'" .github/workflows/deploy-pages.yml

      - name: Commit staged canonical workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-pages.yml
          if git diff --cached --quiet; then
            echo "Canonical workflow already staged"
            exit 0
          fi
          git commit -m "Stage intermediate accounting canonical workflow for PR"
          git push origin HEAD:stage-intermediate-canonical-pr

# Temporary staging workflow; remove after the canonical PR is merged and deployed.
