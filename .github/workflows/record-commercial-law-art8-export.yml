name: Record commercial law Article 8 exporter result

on:
  workflow_run:
    workflows: ["Export commercial law Article 8 follow-up candidate"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record exporter result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failure.log 2>&1 || true
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'run_id': os.environ['RUN_ID'],
              'conclusion': os.environ['CONCLUSION'],
              'url': os.environ['RUN_URL'],
          }
          Path('docs/books/commercial-law/art8_export_receipt.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          log = Path('/tmp/failure.log').read_text(encoding='utf-8', errors='replace')
          Path('docs/books/commercial-law/art8_export_failure.txt').write_text(log[-30000:] + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/books/commercial-law/art8_export_receipt.json docs/books/commercial-law/art8_export_failure.txt
          git commit -m "Record Article 8 exporter result [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
