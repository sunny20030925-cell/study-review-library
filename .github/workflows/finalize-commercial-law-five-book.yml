name: Finalize commercial law five-book library

on:
  push:
    paths:
      - 'docs/commercial_law_five_book_trigger.txt'

permissions:
  contents: write

jobs:
  patch-main-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch canonical deployment to five books
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/deploy-pages.yml')
          text = p.read_text(encoding='utf-8')

          anchor = '''          SITE_ROOT="$GITHUB_WORKSPACE/_site" python /tmp/patch-economics-v2.py

      - name: Add visible per-book version verification
'''
          replacement = '''          SITE_ROOT="$GITHUB_WORKSPACE/_site" python /tmp/patch-economics-v2.py

      - name: Generate commercial law textbook
        run: |
          cat deploy/generate-commercial-law.py.gz.b64.part* | base64 --decode > /tmp/generate-commercial-law.py.gz
          echo '85843044d6fee2f0c5d11208754a4d6b103402392d3a44511745a146874dcdfc  /tmp/generate-commercial-law.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/generate-commercial-law.py.gz > /tmp/generate-commercial-law.py
          python /tmp/generate-commercial-law.py _site

      - name: Add visible per-book version verification
'''
          if 'Generate commercial law textbook' not in text:
              if anchor not in text:
                  raise SystemExit('economics-to-version anchor not found')
              text = text.replace(anchor, replacement, 1)

          release_anchor = "              'statistics': {\n"
          commercial_release = '''              'commercial-law': {
                  'updatedAt': '2026-07-29',
                  'releaseNotes': [{
                      'version': '2026.07.28-1',
                      'date': '2026-07-29',
                      'title': '新增商事法重點整理',
                      'changes': [
                          '以公司法與證券交易法為核心，新增 18 章正文與 3 份附錄',
                          '新增 90 題題庫，每章 5 題，涵蓋法條、要件、責任、程序與常見陷阱',
                          '新增 111 筆搜尋索引、18 張自製圖解與法條速查功能',
                          '完成兩輪內容與題庫 QA，並複核重要門檻、期間與責任規則',
                      ],
                      'progressImpact': '新增獨立書籍，不改動既有書籍的章節、題目 ID 或閱讀進度。',
                  }],
              },
'''
          if "'commercial-law': {" not in text:
              if release_anchor not in text:
                  raise SystemExit('statistics release anchor not found')
              text = text.replace(release_anchor, commercial_release + release_anchor, 1)

          text = text.replace("2026.07.29-1", "2026.07.29-2")
          text = text.replace(
              "['calculus', 'accounting', 'economics', 'statistics']",
              "['calculus', 'accounting', 'economics', 'statistics', 'commercial-law']",
          )
          text = text.replace(
              "{'calculus': 73, 'accounting': 70, 'economics': 100, 'statistics': 95}",
              "{'calculus': 73, 'accounting': 70, 'economics': 100, 'statistics': 95, 'commercial-law': 90}",
          )

          validation_anchor = '''          app = (site / 'app.js').read_text(encoding='utf-8')
'''
          law_validation = '''          law_root = site / 'books/commercial-law'
          law_manifest = json.loads((law_root / 'manifest.json').read_text(encoding='utf-8'))
          law_questions = json.loads((law_root / 'questions.json').read_text(encoding='utf-8'))
          law_search = json.loads((law_root / 'search.json').read_text(encoding='utf-8'))
          assert law_manifest['version'] == law_questions['version'] == '2026.07.28-1'
          assert len([x for x in law_manifest['chapters'] if x['kind'] == 'chapter']) == 18
          assert len([x for x in law_manifest['chapters'] if x['kind'] == 'appendix']) == 3
          assert len(law_search['entries']) == 111
          assert Counter(q['chapterId'] for q in law_questions['items']) == {f'ch{i:02d}': 5 for i in range(18)}

          law_text = '\\n'.join(
              (law_root / chapter['file']).read_text(encoding='utf-8')
              for chapter in law_manifest['chapters']
          )
          required_concepts = [
              ('公司法第 23 條',),
              ('300 字', '300字'),
              ('持續 6 個月以上', '持股期間 6 個月以上', '持有 6 個月以上'),
              ('第 43-6 條第一項第二款、第三款', '第 43-6 條第 1 項第 2 款、第 3 款', '第 43-6 條第一項第二款及第三款'),
              ('合計不得超過 35 人', '合計不超過 35 人', '合計不得超過35人'),
              ('超過 5%', '超過 5％'),
              ('超過 10%', '超過 10％'),
              ('公開後 18 小時內', '消息公開後 18 小時', '公開後十八小時內'),
              ('證交法第 62 條', '證券交易法第 62 條'),
              ('至少 2 人', '至少二人'),
              ('不得少於董事席次五分之一', '不得少於董事席次 1/5'),
          ]
          for variants in required_concepts:
              assert any(token in law_text for token in variants), f'missing legal concept: {variants}'
          assert '私募對象一律不得超過 35 人' not in law_text
          assert '短線交易只適用上市股票' not in law_text

          law_figures = sorted((site / 'assets/commercial-law-svg').glob('*.svg'))
          assert len(law_figures) == 18
          for figure in law_figures:
              svg = figure.read_text(encoding='utf-8')
              assert '<title' in svg and '<desc' in svg and 'viewBox' in svg

'''
          if "law_root = site / 'books/commercial-law'" not in text:
              if validation_anchor not in text:
                  raise SystemExit('app validation anchor not found')
              text = text.replace(validation_anchor, law_validation + validation_anchor, 1)

          text = text.replace(
              "          assert './assets/statistics-svg/anova.svg' in sw\n",
              "          assert './assets/statistics-svg/anova.svg' in sw\n          assert '法條速查' in app\n          assert './books/commercial-law/manifest.json' in sw\n          assert './books/commercial-law/chapters/ch17.html' in sw\n",
              1,
          )
          text = text.replace('LIBRARY_VALIDATION_OK books=4', 'LIBRARY_VALIDATION_OK books=5')
          text = text.replace("              'book_count': 4,", "              'book_count': 5,")

          receipt_anchor = "              'statistics_content_audit': 'passed',\n"
          commercial_receipt = '''              'commercial_law_version': '2026.07.28-1',
              'commercial_law_chapter_count': 18,
              'commercial_law_question_count': 90,
              'commercial_law_search_count': 111,
              'commercial_law_figure_count': 18,
              'commercial_law_content_audit': 'passed',
'''
          if "'commercial_law_version':" not in text:
              if receipt_anchor not in text:
                  raise SystemExit('receipt anchor not found')
              text = text.replace(receipt_anchor, receipt_anchor + commercial_receipt, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit canonical five-book deployment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-pages.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate commercial law into five-book deployment"
          git push origin HEAD:main
