name: Validate industry trade candidate

on:
  pull_request:
    paths:
      - 'deploy/generate_industry_trade.py'
      - 'deploy/generate-industry-trade.py.gz.b64.part*'
      - 'deploy/finalize_industry_trade_library.py'
      - 'deploy/validate_industry_trade.py'
      - 'deploy/qa_industry_trade_independent.py'
      - 'deploy/integrate_industry_trade.py'
      - 'deploy/record_industry_trade_deployment.py'
      - 'docs/books/industry-trade/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/validate-industry-trade-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Compile industry trade sources
        run: |
          python -m py_compile \
            deploy/generate_industry_trade.py \
            deploy/finalize_industry_trade_library.py \
            deploy/validate_industry_trade.py \
            deploy/qa_industry_trade_independent.py \
            deploy/integrate_industry_trade.py \
            deploy/record_industry_trade_deployment.py

      - name: Download formally recorded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/docs/deployment_receipt.json?ref=main" --jq '.content' \
            | tr -d '\n' | base64 -d > /tmp/deployment-receipt.json
          ARTIFACT_ID="$(python -c "import json;print(json.load(open('/tmp/deployment-receipt.json'))['pages_artifact_id'])")"
          EXPECTED_BASE_LIBRARY="$(python -c "import json;print(json.load(open('/tmp/deployment-receipt.json'))['library_version'])")"
          EXPECTED_BASE_BOOKS="$(python -c "import json;print(json.load(open('/tmp/deployment-receipt.json'))['book_count'])")"
          DIGEST="$(python -c "import json;print(json.load(open('/tmp/deployment-receipt.json'))['pages_artifact_digest'])")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/pages.zip
          echo "${DIGEST#sha256:}  /tmp/pages.zip" | sha256sum --check -
          mkdir /tmp/pages-artifact _site
          unzip -q /tmp/pages.zip -d /tmp/pages-artifact
          if [ -f /tmp/pages-artifact/artifact.tar ]; then
            tar -xf /tmp/pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/pages-artifact/. _site/
          fi
          EXPECTED_BASE_LIBRARY="$EXPECTED_BASE_LIBRARY" EXPECTED_BASE_BOOKS="$EXPECTED_BASE_BOOKS" python - <<'PY'
          import json,os
          from pathlib import Path
          receipt=json.loads(Path('/tmp/deployment-receipt.json').read_text(encoding='utf-8'))
          library=json.loads(Path('_site/data/library.json').read_text(encoding='utf-8'))
          ids=[b['id'] for b in library['books']]
          assert receipt['status']=='success'
          assert receipt['pages_deploy_status']=='success'
          assert library['version']==os.environ['EXPECTED_BASE_LIBRARY']
          assert len(ids)==int(os.environ['EXPECTED_BASE_BOOKS'])
          assert ids[-1]=='industrial-economics'
          assert 'industry-trade' not in ids
          assert (Path('_site')/'app.js').is_file() and (Path('_site')/'sw.js').is_file()
          print(f"FORMAL_BASE_RECEIPT_OK books={len(ids)} library={library['version']} artifact={receipt['pages_artifact_id']}")
          PY
          echo "EXPECTED_BASE_LIBRARY=$EXPECTED_BASE_LIBRARY" >> "$GITHUB_ENV"
          echo "EXPECTED_BASE_BOOKS=$EXPECTED_BASE_BOOKS" >> "$GITHUB_ENV"

      - name: Integrate candidate on current formal tail
        run: |
          set -euo pipefail
          FINAL_LIBRARY_VERSION="$(PYTHONPATH=deploy python deploy/integrate_industry_trade.py _site "$EXPECTED_BASE_LIBRARY")"
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "INDUSTRY_TRADE_BASE_LIBRARY=$EXPECTED_BASE_LIBRARY"
          echo "INDUSTRY_TRADE_BASE_BOOKS=$EXPECTED_BASE_BOOKS"
          echo "INDUSTRY_TRADE_FINAL_LIBRARY=$FINAL_LIBRARY_VERSION"

      - name: Round 1 structural and integration QA
        run: |
          set -euo pipefail
          EXPECTED_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" PYTHONPATH=deploy python deploy/validate_industry_trade.py _site
          node --check _site/app.js
          node --check _site/sw.js

      - name: Round 2 independent content QA
        run: |
          set -euo pipefail
          PYTHONPATH=deploy python deploy/qa_industry_trade_independent.py _site

      - name: Verify formal release shape
        run: |
          set -euo pipefail
          FINAL_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" EXPECTED_BASE_BOOKS="$EXPECTED_BASE_BOOKS" python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('_site'); root=site/'books/industry-trade'
          lib=json.loads((site/'data/library.json').read_text(encoding='utf-8'))
          ids=[b['id'] for b in lib['books']]
          assert lib['version']==os.environ['FINAL_LIBRARY_VERSION']
          assert len(ids)==int(os.environ['EXPECTED_BASE_BOOKS'])+1
          assert ids[-2:]==['industrial-economics','industry-trade']
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          q=json.loads((root/'questions.json').read_text(encoding='utf-8'))
          s=json.loads((root/'search.json').read_text(encoding='utf-8'))
          assert len(m['chapters'])==23
          assert q['count']==len(q['items'])==100
          assert len(s['entries'])==160
          figs=list((site/'assets/industry-trade-svg').glob('*.svg'))
          assert len(figs)==20 and all(p.stat().st_size>300 for p in figs)
          print('INDUSTRY_TRADE_FORMAL_PREFLIGHT_OK',lib['version'],len(ids))
          PY
