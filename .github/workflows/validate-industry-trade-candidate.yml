name: Validate industry trade candidate

on:
  pull_request:
    paths:
      - 'deploy/generate_industry_trade.py'
      - 'deploy/generate-industry-trade.py.gz.b64.part*'
      - 'deploy/finalize_industry_trade_library.py'
      - 'deploy/validate_industry_trade.py'
      - 'deploy/qa_industry_trade_independent.py'
      - 'docs/books/industry-trade/**'
      - '.github/workflows/validate-industry-trade-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Compile industry trade sources
        run: |
          python -m py_compile \
            deploy/generate_industry_trade.py \
            deploy/finalize_industry_trade_library.py \
            deploy/validate_industry_trade.py \
            deploy/qa_industry_trade_independent.py

      - name: Download latest deployed Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -n 1)"
          test -n "$ARTIFACT_ID"
          echo "BASE_DEPLOY_RUN=$RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/pages.zip
          mkdir /tmp/pages-artifact _site
          unzip -q /tmp/pages.zip -d /tmp/pages-artifact
          if [ -f /tmp/pages-artifact/artifact.tar ]; then
            tar -xf /tmp/pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/pages-artifact/. _site/
          fi
          test -f _site/data/library.json
          test -f _site/sw.js
          test -f _site/app.js

      - name: Generate candidate on latest deployed library copy
        run: |
          set -euo pipefail
          cp _site/data/library.json /tmp/pre-industry-trade-library.json
          find _site/books -type f ! -path '*/industry-trade/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-existing-books.sha256
          python deploy/generate_industry_trade.py _site
          FINAL_LIBRARY_VERSION="$(python deploy/finalize_industry_trade_library.py _site /tmp/pre-industry-trade-library.json)"
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "INDUSTRY_TRADE_FINAL_LIBRARY=$FINAL_LIBRARY_VERSION"

      - name: Round 1 structural and integration QA
        run: |
          set -euo pipefail
          EXPECTED_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" PRE_LIBRARY_JSON=/tmp/pre-industry-trade-library.json \
            python deploy/validate_industry_trade.py _site
          find _site/books -type f ! -path '*/industry-trade/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-existing-books.sha256
          diff -u /tmp/pre-existing-books.sha256 /tmp/post-existing-books.sha256
          node --check _site/app.js
          node --check _site/sw.js

      - name: Round 2 independent content QA
        run: |
          set -euo pipefail
          python deploy/qa_industry_trade_independent.py _site

      - name: Verify tablet-facing asset paths exist
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          site=Path('_site'); root=site/'books/industry-trade'
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert len(m['chapters'])==23
          for ch in m['chapters']:
              p=root/ch['file']; assert p.is_file() and p.stat().st_size>700, ch
          figs=list((site/'assets/industry-trade-svg').glob('*.svg'))
          assert len(figs)==20 and all(p.stat().st_size>300 for p in figs)
          q=json.loads((root/'questions.json').read_text(encoding='utf-8'))
          s=json.loads((root/'search.json').read_text(encoding='utf-8'))
          assert q['count']==len(q['items'])==100
          assert len(s['entries'])==160
          print('INDUSTRY_TRADE_TABLET_ASSET_PATHS_OK')
          PY
