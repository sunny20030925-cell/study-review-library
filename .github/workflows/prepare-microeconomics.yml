name: Prepare microeconomics canonical deployment

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integrate microeconomics into latest canonical workflow
        run: |
          base64 --decode deploy/integrate-microeconomics-latest.py.xz.b64 > /tmp/integrate-microeconomics-latest.py.xz
          echo '698876ce5f55a0fdf0a559c6b29958a37f7d3e67b5a65b7f74673472264aafed  /tmp/integrate-microeconomics-latest.py.xz' | sha256sum --check -
          xz --decompress --stdout /tmp/integrate-microeconomics-latest.py.xz > /tmp/integrate-microeconomics-latest.py
          python /tmp/integrate-microeconomics-latest.py
      - name: Stage generated canonical workflow
        run: |
          cp .github/workflows/deploy-pages.yml deploy/generated-deploy-pages.microeconomics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/generated-deploy-pages.microeconomics.yml
          if git diff --cached --quiet; then
            echo 'Generated workflow already staged on main.'
            exit 0
          fi
          git commit -m 'Stage generated microeconomics canonical workflow [skip ci]'
          git push origin HEAD:main
