name: Prepare microeconomics canonical deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integrate microeconomics into latest canonical workflow
        run: |
          base64 --decode deploy/integrate-microeconomics-latest.py.xz.b64 > /tmp/integrate-microeconomics-latest.py.xz
          echo '698876ce5f55a0fdf0a559c6b29958a37f7d3e67b5a65b7f74673472264aafed  /tmp/integrate-microeconomics-latest.py.xz' | sha256sum --check -
          xz --decompress --stdout /tmp/integrate-microeconomics-latest.py.xz > /tmp/integrate-microeconomics-latest.py
          python /tmp/integrate-microeconomics-latest.py
      - name: Commit canonical workflow only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-pages.yml
          git rm .github/workflows/prepare-microeconomics.yml deploy/integrate-microeconomics-latest.py.xz.b64
          git commit -m 'Integrate microeconomics into canonical deploy'
          git push origin HEAD:main
