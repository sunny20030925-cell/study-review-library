name: Deploy study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Decode and compile Investments sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/investments-src
          cat deploy/investments-src.tar.xz.b64.part* | tr -d '\n\r\t ' | base64 --decode > /tmp/investments-src.tar.xz
          echo '5507e92996f4793437517d5c43fd25f2a11c1e5c352f90d3e2de7607852a2d4f  /tmp/investments-src.tar.xz' | sha256sum --check -
          xz --test /tmp/investments-src.tar.xz
          tar -xJf /tmp/investments-src.tar.xz -C /tmp/investments-src
          python -m py_compile /tmp/investments-src/*.py
          python -m py_compile deploy/record_investments_deployment.py

      - name: Download and verify latest formal Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_id'])")"
          ARTIFACT_DIGEST="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_digest'])")"
          EXPECTED_SHA="${ARTIFACT_DIGEST#sha256:}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/base-pages.zip
          echo "${EXPECTED_SHA}  /tmp/base-pages.zip" | sha256sum --check -
          mkdir -p /tmp/base-pages-artifact _site
          unzip -q /tmp/base-pages.zip -d /tmp/base-pages-artifact
          if [ -f /tmp/base-pages-artifact/artifact.tar ]; then
            tar -xf /tmp/base-pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/base-pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/base-pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/base-pages-artifact/. _site/
          fi
          cp _site/data/library.json /tmp/pre-investments-library.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt=json.loads(Path('docs/deployment_receipt.json').read_text(encoding='utf-8'))
          library=json.loads(Path('_site/data/library.json').read_text(encoding='utf-8'))
          ids=[b['id'] for b in library['books']]
          assert receipt['status']=='success'
          assert receipt['pages_deploy_status']=='success'
          assert receipt['artifact_download_recheck']=='passed'
          assert receipt['civil_law_overview_version']=='2026.07.29-1'
          assert receipt['book_count']==16 and receipt['library_version']=='2026.07.29-21', receipt
          assert library['version']==receipt['library_version']
          assert len(ids)==receipt['book_count']==16
          assert ids[-1]=='civil-law-overview' and ids.count('civil-law-overview')==1, ids
          assert len(set(ids))==len(ids)
          assert (Path('_site')/'app.js').is_file() and (Path('_site')/'sw.js').is_file()
          root=Path('_site/books/civil-law-overview')
          assert len(list((root/'chapters').glob('*.html')))==23
          assert json.load(open(root/'questions.json'))['count']==100
          assert len(json.load(open(root/'search.json'))['entries'])==150
          assert len(list(Path('_site/assets/civil-law-overview-svg').glob('*.svg')))==20
          print('FORMAL_CIVIL_BASE_OK',library['version'],len(ids))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"BASE_LIBRARY_VERSION={library['version']}\n")
              f.write(f"BASE_BOOK_COUNT={len(ids)}\n")
          PY

      - name: Integrate and validate Investments
        run: |
          set -euo pipefail
          BEFORE="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
          FINAL_LIBRARY_VERSION="$(PYTHONPATH=/tmp/investments-src python /tmp/investments-src/integrate_investments.py _site "$BEFORE")"
          EXPECTED_FINAL_BOOK_COUNT="$((BASE_BOOK_COUNT + 1))"
          export FINAL_LIBRARY_VERSION EXPECTED_FINAL_BOOK_COUNT
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "EXPECTED_FINAL_BOOK_COUNT=$EXPECTED_FINAL_BOOK_COUNT" >> "$GITHUB_ENV"
          node --check _site/app.js
          node --check _site/sw.js
          PYTHONPATH=/tmp/investments-src python /tmp/investments-src/validate_investments.py _site "$FINAL_LIBRARY_VERSION"
          PYTHONPATH=/tmp/investments-src python /tmp/investments-src/qa_investments_round2.py _site "$FINAL_LIBRARY_VERSION"
          python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('_site')
          pre=json.loads(Path('/tmp/pre-investments-library.json').read_text(encoding='utf-8'))
          final=json.loads((site/'data/library.json').read_text(encoding='utf-8'))
          pre_ids=[b['id'] for b in pre['books']]
          ids=[b['id'] for b in final['books']]
          assert pre_ids[-1]=='civil-law-overview' and len(pre_ids)==16, pre_ids
          assert final['version']==os.environ['FINAL_LIBRARY_VERSION']=='2026.07.29-22'
          assert len(ids)==int(os.environ['EXPECTED_FINAL_BOOK_COUNT'])==17
          assert ids==pre_ids+['investments'], (pre_ids,ids)
          root=site/'books/investments'
          manifest=json.load(open(root/'manifest.json'))
          questions=json.load(open(root/'questions.json'))
          search=json.load(open(root/'search.json'))
          assert len([x for x in manifest['chapters'] if x['kind']=='chapter'])==22
          assert len([x for x in manifest['chapters'] if x['kind']=='appendix'])==3
          assert questions['count']==110 and len(questions['items'])==110
          assert len(search['entries'])==165
          assert len(list((site/'assets/investments-svg').glob('*.svg')))==22
          print('INVESTMENTS_LIBRARY_READY',final['version'],len(ids))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Re-download and verify deployed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | tail -n 1)"
          ARTIFACT_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .digest' | tail -n 1)"
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/deployed-pages.zip
          ACTUAL_SHA="$(sha256sum /tmp/deployed-pages.zip | awk '{print $1}')"
          EXPECTED_SHA="${ARTIFACT_DIGEST#sha256:}"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          rm -rf /tmp/deployed-pages-artifact /tmp/deployed-site
          mkdir -p /tmp/deployed-pages-artifact /tmp/deployed-site
          unzip -q /tmp/deployed-pages.zip -d /tmp/deployed-pages-artifact
          if [ -f /tmp/deployed-pages-artifact/artifact.tar ]; then
            tar -xf /tmp/deployed-pages-artifact/artifact.tar -C /tmp/deployed-site
          elif [ -f /tmp/deployed-pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/deployed-pages-artifact/artifact.tar.gz -C /tmp/deployed-site
          else
            cp -a /tmp/deployed-pages-artifact/. /tmp/deployed-site/
          fi
          PYTHONPATH=/tmp/investments-src python /tmp/investments-src/validate_investments.py /tmp/deployed-site "$FINAL_LIBRARY_VERSION"
          PYTHONPATH=/tmp/investments-src python /tmp/investments-src/qa_investments_round2.py /tmp/deployed-site "$FINAL_LIBRARY_VERSION"
          python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('/tmp/deployed-site')
          pre=json.loads(Path('/tmp/pre-investments-library.json').read_text(encoding='utf-8'))
          library=json.loads((site/'data/library.json').read_text(encoding='utf-8'))
          ids=[b['id'] for b in library['books']]
          pre_ids=[b['id'] for b in pre['books']]
          assert library['version']==os.environ['FINAL_LIBRARY_VERSION']=='2026.07.29-22'
          assert len(ids)==int(os.environ['EXPECTED_FINAL_BOOK_COUNT'])==17
          assert ids==pre_ids+['investments']
          civil=site/'books/civil-law-overview'
          assert len(list((civil/'chapters').glob('*.html')))==23
          assert json.load(open(civil/'questions.json'))['count']==100
          assert len(json.load(open(civil/'search.json'))['entries'])==150
          assert len(list((site/'assets/civil-law-overview-svg').glob('*.svg')))==20
          root=site/'books/investments'
          manifest=json.load(open(root/'manifest.json'))
          questions=json.load(open(root/'questions.json'))
          search=json.load(open(root/'search.json'))
          assert len([x for x in manifest['chapters'] if x['kind']=='chapter'])==22
          assert len([x for x in manifest['chapters'] if x['kind']=='appendix'])==3
          assert len(list((root/'chapters').glob('*.html')))==25
          assert questions['count']==110 and len(questions['items'])==110
          assert len(search['entries'])==165
          assert len(list((site/'assets/investments-svg').glob('*.svg')))==22
          print('DEPLOYED_INVESTMENTS_ARTIFACT_RECHECK_OK',library['version'],len(ids))
          PY
          echo "PAGES_ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "PAGES_ARTIFACT_DIGEST=$ARTIFACT_DIGEST" >> "$GITHUB_ENV"
          echo "PAGES_ARTIFACT_SHA256=$ACTUAL_SHA" >> "$GITHUB_ENV"
          echo "DEPLOYED_PAGE_URL=$DEPLOYED_PAGE_URL" >> "$GITHUB_ENV"

      - name: Record successful Investments deployment structurally
        run: |
          set -euo pipefail
          python deploy/record_investments_deployment.py _site
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/deployment_receipt.json \
            README.md \
            docs/shared_checkpoint.md \
            docs/books/investments/status.md \
            docs/books/investments/qa_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Investments deployment [skip ci]"
            git push origin HEAD:main
          fi
