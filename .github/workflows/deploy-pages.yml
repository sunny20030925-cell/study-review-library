name: Deploy study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download and verify latest formal Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_id'])")"
          ARTIFACT_DIGEST="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_digest'])")"
          BASE_LIBRARY_VERSION="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['library_version'])")"
          BASE_BOOK_COUNT="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['book_count'])")"
          EXPECTED_SHA="${ARTIFACT_DIGEST#sha256:}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/base-pages.zip
          echo "${EXPECTED_SHA}  /tmp/base-pages.zip" | sha256sum --check -
          mkdir -p /tmp/base-pages-artifact _site
          unzip -q /tmp/base-pages.zip -d /tmp/base-pages-artifact
          if [ -f /tmp/base-pages-artifact/artifact.tar ]; then
            tar -xf /tmp/base-pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/base-pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/base-pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/base-pages-artifact/. _site/
          fi
          BASE_LIBRARY_VERSION="$BASE_LIBRARY_VERSION" BASE_BOOK_COUNT="$BASE_BOOK_COUNT" python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('_site')
          library=json.load(open(site/'data/library.json'))
          assert library['version']==os.environ['BASE_LIBRARY_VERSION']
          assert len(library['books'])==int(os.environ['BASE_BOOK_COUNT'])
          assert (site/'app.js').is_file() and (site/'sw.js').is_file()
          print('FORMAL_ARTIFACT_BASE_OK',library['version'],len(library['books']))
          PY
          echo "BASE_LIBRARY_VERSION=$BASE_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "BASE_BOOK_COUNT=$BASE_BOOK_COUNT" >> "$GITHUB_ENV"

      - name: Append and validate econometrics
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json,sys
          library=json.load(open('_site/data/library.json'))
          sys.exit(0 if any(b['id']=='econometrics' for b in library['books']) else 1)
          PY
          then
            FINAL_LIBRARY_VERSION="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
            FINAL_BOOK_COUNT="$BASE_BOOK_COUNT"
            EXPECTED_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" python deploy/validate_econometrics.py _site
            python deploy/validate_econometrics_v2.py _site
          else
            cp _site/data/library.json /tmp/pre-econometrics-library.json
            find _site/books -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-econometrics-books.sha256
            python deploy/generate_econometrics.py _site
            FINAL_LIBRARY_VERSION="$(python deploy/finalize_econometrics_library.py _site /tmp/pre-econometrics-library.json)"
            FINAL_BOOK_COUNT="$((BASE_BOOK_COUNT + 1))"
            EXPECTED_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" PRE_LIBRARY_JSON=/tmp/pre-econometrics-library.json python deploy/validate_econometrics.py _site
            python deploy/validate_econometrics_v2.py _site
            find _site/books -type f ! -path '*/econometrics/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-econometrics-books.sha256
            diff -u /tmp/pre-econometrics-books.sha256 /tmp/post-econometrics-books.sha256
          fi
          export FINAL_LIBRARY_VERSION FINAL_BOOK_COUNT
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "FINAL_BOOK_COUNT=$FINAL_BOOK_COUNT" >> "$GITHUB_ENV"
          node --check _site/app.js
          node --check _site/sw.js
          python - <<'PY'
          import json,os
          library=json.load(open('_site/data/library.json'))
          ids=[b['id'] for b in library['books']]
          assert library['version']==os.environ['FINAL_LIBRARY_VERSION']
          assert len(ids)==int(os.environ['FINAL_BOOK_COUNT'])
          assert 'econometrics' in ids
          print('FINAL_LIBRARY_READY',library['version'],len(ids),ids[-1])
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Re-download and verify deployed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | tail -n 1)"
          ARTIFACT_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .digest' | tail -n 1)"
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/deployed-pages.zip
          ACTUAL_SHA="$(sha256sum /tmp/deployed-pages.zip | awk '{print $1}')"
          EXPECTED_SHA="${ARTIFACT_DIGEST#sha256:}"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          rm -rf /tmp/deployed-pages-artifact /tmp/deployed-site
          mkdir -p /tmp/deployed-pages-artifact /tmp/deployed-site
          unzip -q /tmp/deployed-pages.zip -d /tmp/deployed-pages-artifact
          if [ -f /tmp/deployed-pages-artifact/artifact.tar ]; then
            tar -xf /tmp/deployed-pages-artifact/artifact.tar -C /tmp/deployed-site
          elif [ -f /tmp/deployed-pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/deployed-pages-artifact/artifact.tar.gz -C /tmp/deployed-site
          else
            cp -a /tmp/deployed-pages-artifact/. /tmp/deployed-site/
          fi
          FINAL_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" FINAL_BOOK_COUNT="$FINAL_BOOK_COUNT" python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('/tmp/deployed-site')
          library=json.load(open(site/'data/library.json'))
          ids=[b['id'] for b in library['books']]
          assert library['version']==os.environ['FINAL_LIBRARY_VERSION']
          assert len(ids)==int(os.environ['FINAL_BOOK_COUNT'])
          assert 'econometrics' in ids
          root=site/'books/econometrics'
          manifest=json.load(open(root/'manifest.json'))
          questions=json.load(open(root/'questions.json'))
          search=json.load(open(root/'search.json'))
          assert len(manifest['chapters'])==23
          assert questions['count']==100
          assert len(search['entries'])==189
          assert len(list((site/'assets/econometrics-svg').glob('*.svg')))==20
          print('DEPLOYED_ARTIFACT_RECHECK_OK',library['version'],len(ids))
          PY
          EXPECTED_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" python deploy/validate_econometrics.py /tmp/deployed-site
          python deploy/validate_econometrics_v2.py /tmp/deployed-site
          echo "DEPLOYMENT_PROOF run=${GITHUB_RUN_ID} artifact=${ARTIFACT_ID} digest=${ARTIFACT_DIGEST} sha256=${ACTUAL_SHA} page=${DEPLOYED_PAGE_URL} library=${FINAL_LIBRARY_VERSION} books=${FINAL_BOOK_COUNT}"
