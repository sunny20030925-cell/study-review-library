name: Deploy study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download website package
        run: |
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1rgPS62bIZOWC8H3zSrw-RBZ3jkg9SDcs&export=download&confirm=t' \
            -o site.zip
          mkdir _site
          unzip -q site.zip -d _site
          rm -rf _site/.github

      - name: Generate accounting book
        run: |
          cat deploy/accounting-generator.py.gz.b64.part* | base64 --decode > /tmp/accounting-generator.py.gz
          echo 'e2936ad80e35d8312eec9e0956ec304078557e0f74299f67715640e4d30c138f  /tmp/accounting-generator.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/accounting-generator.py.gz > /tmp/generate_accounting.py
          python -m pip install --disable-pip-version-check --quiet beautifulsoup4
          SITE_ROOT="$GITHUB_WORKSPACE/_site" \
            OUTPUT_ZIP="/tmp/study-library-with-accounting.zip" \
            python /tmp/generate_accounting.py
          test "$(python -c "import json; print(json.load(open('_site/data/library.json'))['version'])")" = '2026.07.27-4'
          test "$(python -c "import json; print(json.load(open('_site/books/accounting/questions.json'))['count'])")" = '70'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "status": "success",
              "library_version": "2026.07.27-4",
              "accounting_version": "2026.07.27-1",
              "question_count": 70,
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "page_url": os.environ.get("DEPLOYED_PAGE_URL", ""),
              "deployed_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("docs/deployment_receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deployment_receipt.json
          git commit -m "Record successful Pages deployment [skip ci]"
          git push origin HEAD:main
