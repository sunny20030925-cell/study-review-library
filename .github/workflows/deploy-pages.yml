name: Deploy study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Compile mathematical economics release sources
        run: |
          set -euo pipefail
          python -m py_compile \
            deploy/mathematical_economics_content.py \
            deploy/mathematical_economics_questions.py \
            deploy/generate_mathematical_economics.py \
            deploy/qa_mathematical_economics.py \
            deploy/integrate_mathematical_economics.py \
            deploy/record_mathematical_economics_deployment.py
          echo "MATHEMATICAL_ECONOMICS_SOURCE_COMPILE_OK"

      - name: Download and verify latest formal Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_id'])")"
          ARTIFACT_DIGEST="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_digest'])")"
          EXPECTED_SHA="${ARTIFACT_DIGEST#sha256:}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/base-pages.zip
          echo "${EXPECTED_SHA}  /tmp/base-pages.zip" | sha256sum --check -
          mkdir -p /tmp/base-pages-artifact _site
          unzip -q /tmp/base-pages.zip -d /tmp/base-pages-artifact
          if [ -f /tmp/base-pages-artifact/artifact.tar ]; then
            tar -xf /tmp/base-pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/base-pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/base-pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/base-pages-artifact/. _site/
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          site=Path('_site')
          receipt=json.load(open('docs/deployment_receipt.json'))
          library=json.load(open(site/'data/library.json'))
          assert library['version']==receipt['library_version'], (library['version'],receipt['library_version'])
          assert len(library['books'])==receipt['book_count']==15
          assert receipt.get('game_theory_two_round_qa')=='passed'
          assert receipt.get('game_theory_existing_book_hashes_preserved') is True
          assert (site/'app.js').is_file() and (site/'sw.js').is_file()
          print('FORMAL_ARTIFACT_BASE_OK',library['version'],len(library['books']))
          PY

      - name: Validate formal game theory tail
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          site=Path('_site')
          d=json.load(open(site/'data/library.json'))
          ids=[b['id'] for b in d['books']]
          assert len(ids)==15 and ids[-2:]==['computer-fundamentals','game-theory'], ids
          root=site/'books/game-theory'
          m=json.load(open(root/'manifest.json'))
          q=json.load(open(root/'questions.json'))
          s=json.load(open(root/'search.json'))
          assert len(m['chapters'])==23
          assert q['count']==100
          assert len(s['entries'])==189
          assert len(list((site/'assets/game-theory-svg').glob('*.svg')))==20
          print('GAME_THEORY_FORMAL_BASE_OK',d['version'],len(ids))
          PY
          node --check _site/app.js
          node --check _site/sw.js

      - name: Integrate or validate mathematical economics
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json,sys
          d=json.load(open('_site/data/library.json'))
          sys.exit(0 if any(b['id']=='mathematical-economics' for b in d['books']) else 1)
          PY
          then
            FINAL_LIBRARY_VERSION="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
            python deploy/qa_mathematical_economics.py _site "$FINAL_LIBRARY_VERSION"
          else
            BEFORE="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
            FINAL_LIBRARY_VERSION="$(python deploy/integrate_mathematical_economics.py _site "$BEFORE")"
          fi
          export FINAL_LIBRARY_VERSION
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          node --check _site/app.js
          node --check _site/sw.js
          python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('_site')
          library=json.load(open(site/'data/library.json'))
          assert library['version']==os.environ['FINAL_LIBRARY_VERSION']
          ids=[b['id'] for b in library['books']]
          assert len(ids)==16 and ids[-3:]==['computer-fundamentals','game-theory','mathematical-economics'], ids
          root=site/'books/mathematical-economics'
          manifest=json.load(open(root/'manifest.json'))
          questions=json.load(open(root/'questions.json'))
          search=json.load(open(root/'search.json'))
          assert len(manifest['chapters'])==23
          assert questions['count']==100
          assert len(search['entries'])==150
          assert len(list((site/'assets/mathematical-economics-svg').glob('*.svg')))==20
          print('MATHEMATICAL_ECONOMICS_FINAL_LIBRARY_READY',library['version'],len(ids))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Re-download and verify deployed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | tail -n 1)"
          ARTIFACT_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .digest' | tail -n 1)"
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/deployed-pages.zip
          ACTUAL_SHA="$(sha256sum /tmp/deployed-pages.zip | awk '{print $1}')"
          EXPECTED_SHA="${ARTIFACT_DIGEST#sha256:}"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          rm -rf /tmp/deployed-pages-artifact /tmp/deployed-site
          mkdir -p /tmp/deployed-pages-artifact /tmp/deployed-site
          unzip -q /tmp/deployed-pages.zip -d /tmp/deployed-pages-artifact
          if [ -f /tmp/deployed-pages-artifact/artifact.tar ]; then
            tar -xf /tmp/deployed-pages-artifact/artifact.tar -C /tmp/deployed-site
          elif [ -f /tmp/deployed-pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/deployed-pages-artifact/artifact.tar.gz -C /tmp/deployed-site
          else
            cp -a /tmp/deployed-pages-artifact/. /tmp/deployed-site/
          fi
          FINAL_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('/tmp/deployed-site')
          library=json.load(open(site/'data/library.json'))
          assert library['version']==os.environ['FINAL_LIBRARY_VERSION']
          ids=[b['id'] for b in library['books']]
          assert len(ids)==16 and ids[-2:]==['game-theory','mathematical-economics'], ids
          game=site/'books/game-theory'
          assert len(json.load(open(game/'manifest.json'))['chapters'])==23
          assert json.load(open(game/'questions.json'))['count']==100
          assert len(json.load(open(game/'search.json'))['entries'])==189
          assert len(list((site/'assets/game-theory-svg').glob('*.svg')))==20
          root=site/'books/mathematical-economics'
          manifest=json.load(open(root/'manifest.json'))
          questions=json.load(open(root/'questions.json'))
          search=json.load(open(root/'search.json'))
          assert len(manifest['chapters'])==23
          assert questions['count']==100
          assert len(search['entries'])==150
          assert len(list((site/'assets/mathematical-economics-svg').glob('*.svg')))==20
          for ch in manifest['chapters']:
              text=(root/ch['file']).read_text(encoding='utf-8')
              assert "\\'" not in text, ch['id']
          print('DEPLOYED_MATHEMATICAL_ECONOMICS_RECHECK_OK',library['version'],len(ids))
          PY
          echo "PAGES_ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "PAGES_ARTIFACT_DIGEST=$ARTIFACT_DIGEST" >> "$GITHUB_ENV"
          echo "PAGES_ARTIFACT_SHA256=$ACTUAL_SHA" >> "$GITHUB_ENV"
          echo "DEPLOYED_PAGE_URL=$DEPLOYED_PAGE_URL" >> "$GITHUB_ENV"

      - name: Record successful mathematical economics deployment
        run: |
          set -euo pipefail
          python deploy/record_mathematical_economics_deployment.py _site
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/deployment_receipt.json \
            README.md \
            docs/shared_checkpoint.md \
            docs/books/mathematical-economics/status.md \
            docs/books/mathematical-economics/qa_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Record mathematical economics deployment [skip ci]"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                pushed=true
                break
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            test "$pushed" = true
          fi
