name: Deploy study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download and verify website package
        run: |
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1rgPS62bIZOWC8H3zSrw-RBZ3jkg9SDcs&export=download&confirm=t' \
            -o site.zip
          echo '12b9e8f2639ac8b27157e456a985c905d91e590f88465ebf8c4b5786846f3774  site.zip' | sha256sum --check -
          mkdir _site
          python -m zipfile -e site.zip _site
          rm -rf _site/.github

      - name: Validate study library
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          site = Path("_site")
          library = json.loads((site / "data/library.json").read_text(encoding="utf-8"))
          assert library["version"] == "2026.07.27-5"
          assert [book["id"] for book in library["books"]] == ["calculus", "accounting", "economics"]

          expected = {"calculus": 73, "accounting": 70, "economics": 100}
          for book_id, count in expected.items():
              manifest = json.loads((site / f"books/{book_id}/manifest.json").read_text(encoding="utf-8"))
              questions = json.loads((site / f"books/{book_id}/questions.json").read_text(encoding="utf-8"))
              search = json.loads((site / f"books/{book_id}/search.json").read_text(encoding="utf-8"))
              assert manifest["id"] == book_id
              assert questions["count"] == count == len(questions["items"])
              assert search["entries"]
              for chapter in manifest["chapters"]:
                  path = site / "books" / book_id / chapter["file"]
                  assert path.is_file() and path.stat().st_size > 100

          economics_manifest = json.loads((site / "books/economics/manifest.json").read_text(encoding="utf-8"))
          economics_questions = json.loads((site / "books/economics/questions.json").read_text(encoding="utf-8"))
          assert economics_manifest["version"] == "2026.07.27-1"
          assert len([x for x in economics_manifest["chapters"] if x["kind"] == "chapter"]) == 20
          assert len([x for x in economics_manifest["chapters"] if x["kind"] == "appendix"]) == 3
          assert Counter(q["chapterId"] for q in economics_questions["items"]) == {
              f"ch{i:02d}": 5 for i in range(20)
          }
          figures = sorted((site / "assets/economics-svg").glob("*.svg"))
          assert len(figures) == 20
          for figure in figures:
              text = figure.read_text(encoding="utf-8")
              assert "<title" in text and "<desc" in text and "viewBox" in text

          sw = (site / "sw.js").read_text(encoding="utf-8")
          for token in (
              "study-library-2026-07-27-5",
              "./books/economics/manifest.json",
              "./books/economics/chapters/ch19.html",
              "./assets/economics-svg/open-economy.svg",
          ):
              assert token in sw
          print("LIBRARY_VALIDATION_OK books=3 economics_chapters=20 economics_questions=100 economics_figures=20")
          PY
          node --check _site/app.js
          node --check _site/sw.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "status": "success",
              "library_version": "2026.07.27-5",
              "calculus_question_count": 73,
              "accounting_version": "2026.07.27-1",
              "accounting_question_count": 70,
              "economics_version": "2026.07.27-1",
              "economics_question_count": 100,
              "book_count": 3,
              "package_sha256": "12b9e8f2639ac8b27157e456a985c905d91e590f88465ebf8c4b5786846f3774",
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "page_url": os.environ.get("DEPLOYED_PAGE_URL", ""),
              "deployed_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("docs/deployment_receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deployment_receipt.json
          git commit -m "Record successful Pages deployment [skip ci]"
          git push origin HEAD:main
