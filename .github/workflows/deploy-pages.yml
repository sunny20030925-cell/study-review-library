name: Deploy study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download and verify website package
        run: |
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20 \
            'https://drive.usercontent.google.com/download?id=1rgPS62bIZOWC8H3zSrw-RBZ3jkg9SDcs&export=download&confirm=t' \
            -o site.zip
          echo 'ece2a68f5bdaf7fd82c3897bf49a9628121e9775f6b75ee7d7b375c1bbe01600  site.zip' | sha256sum --check -
          mkdir _site
          python -m zipfile -e site.zip _site
          rm -rf _site/.github

      - name: Apply accounting second-audit corrections
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          path = Path('_site/sw.js')
          text = path.read_text(encoding='utf-8')
          current = "const VERSION = 'study-library-2026-07-28-1';"
          expected = "const VERSION = 'study-library-2026-07-27-5';"
          if current in text:
              path.write_text(text.replace(current, expected, 1), encoding='utf-8')
          elif expected not in text:
              raise AssertionError('unexpected service worker version before accounting patch')
          PY
          python deploy/patch_accounting_v2.py _site

      - name: Apply economics independent-audit corrections
        run: |
          cat deploy/patch-economics-v2.py.gz.b64.part* | base64 --decode > /tmp/patch-economics-v2.py.gz
          echo 'b675b23d8711c75b2d736315b3161d5c2afc608d11e55249ec9ea5bd1e4d97fa  /tmp/patch-economics-v2.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/patch-economics-v2.py.gz > /tmp/patch-economics-v2.py
          SITE_ROOT="$GITHUB_WORKSPACE/_site" python /tmp/patch-economics-v2.py

      - name: Apply statistics post-publication audit corrections
        run: python deploy/patch_statistics_v2.py _site

      - name: Generate commercial law textbook
        run: |
          cat deploy/generate-commercial-law.py.gz.b64.part* | base64 --decode > /tmp/generate-commercial-law.py.gz
          echo '85843044d6fee2f0c5d11208754a4d6b103402392d3a44511745a146874dcdfc  /tmp/generate-commercial-law.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/generate-commercial-law.py.gz > /tmp/generate-commercial-law.py
          python /tmp/generate-commercial-law.py _site
          python deploy/patch-commercial-law-reaudit.py _site

      - name: Generate macroeconomics textbook
        run: |
          cat deploy/generate-macroeconomics.py.gz.b64.part* | base64 --decode > /tmp/generate-macroeconomics.py.gz
          echo '708179670f1e9a52d7c94cabaeed6ec04c56c7fad260104e932045e117c6b6c1  /tmp/generate-macroeconomics.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/generate-macroeconomics.py.gz > /tmp/generate-macroeconomics.py
          python -m py_compile /tmp/generate-macroeconomics.py
          python /tmp/generate-macroeconomics.py _site

      - name: Finalize and validate six-book library
        run: |
          python deploy/finalize_validate_v7.py _site
          node --check _site/app.js
          node --check _site/sw.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt = {
              'status': 'success', 'library_version': '2026.07.29-7',
              'book_versions_visible': True, 'progress_storage_changed': False, 'book_count': 6,
              'accounting_version': '2026.07.27-2', 'economics_version': '2026.07.27-2',
              'statistics_version': '2026.07.29-2', 'commercial_law_version': '2026.07.29-2',
              'macroeconomics_version': '2026.07.29-1', 'macroeconomics_chapter_count': 20,
              'macroeconomics_question_count': 100, 'macroeconomics_search_count': 143,
              'macroeconomics_figure_count': 20, 'macroeconomics_content_audit': 'two-round-passed',
              'source_commit': os.environ['GITHUB_SHA'], 'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'page_url': os.environ.get('DEPLOYED_PAGE_URL', ''), 'deployed_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('docs/deployment_receipt.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deployment_receipt.json
          git commit -m "Record successful six-book Pages deployment [skip ci]"
          git push origin HEAD:main
