name: Deploy study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Download and verify latest formal Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_id'])")"
          DIGEST="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_digest'])")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/base-pages.zip
          echo "${DIGEST#sha256:}  /tmp/base-pages.zip" | sha256sum --check -
          mkdir -p /tmp/base-pages-artifact _site; unzip -q /tmp/base-pages.zip -d /tmp/base-pages-artifact
          if [ -f /tmp/base-pages-artifact/artifact.tar ]; then tar -xf /tmp/base-pages-artifact/artifact.tar -C _site; elif [ -f /tmp/base-pages-artifact/artifact.tar.gz ]; then tar -xzf /tmp/base-pages-artifact/artifact.tar.gz -C _site; else cp -a /tmp/base-pages-artifact/. _site/; fi
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.load(open('docs/deployment_receipt.json')); lib=json.load(open('_site/data/library.json')); ids=[b['id'] for b in lib['books']]
          assert lib['version']==receipt['library_version']; assert len(ids)==receipt['book_count']; assert (Path('_site')/'app.js').is_file() and (Path('_site')/'sw.js').is_file(); Path('/tmp/base_ids.json').write_text(json.dumps(ids)); print('FORMAL_ARTIFACT_BASE_OK',lib['version'],len(ids))
          PY
      - name: Integrate or validate industrial economics
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json,sys
          d=json.load(open('_site/data/library.json')); sys.exit(0 if any(b['id']=='industrial-economics' for b in d['books']) else 1)
          PY
          then
            FINAL_LIBRARY_VERSION="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
            QA1="$(PYTHONPATH=deploy python deploy/validate_industrial_economics.py _site "$FINAL_LIBRARY_VERSION" | tee /tmp/qa1.log | sed -n 's/.*checks=\([0-9][0-9]*\).*/\1/p')"
            QA2="$(PYTHONPATH=deploy python deploy/qa_industrial_economics.py _site "$FINAL_LIBRARY_VERSION" | tee /tmp/qa2.log | sed -n 's/.*checks=\([0-9][0-9]*\).*/\1/p')"
          else
            BEFORE="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
            FINAL_LIBRARY_VERSION="$(PYTHONPATH=deploy python deploy/integrate_industrial_economics.py _site "$BEFORE")"
            QA1="$(PYTHONPATH=deploy python deploy/validate_industrial_economics.py _site "$FINAL_LIBRARY_VERSION" | tee /tmp/qa1.log | sed -n 's/.*checks=\([0-9][0-9]*\).*/\1/p')"
            QA2="$(PYTHONPATH=deploy python deploy/qa_industrial_economics.py _site "$FINAL_LIBRARY_VERSION" | tee /tmp/qa2.log | sed -n 's/.*checks=\([0-9][0-9]*\).*/\1/p')"
          fi
          export FINAL_LIBRARY_VERSION; echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"; echo "INDUSTRIAL_QA1_CHECKS=$QA1" >> "$GITHUB_ENV"; echo "INDUSTRIAL_QA2_CHECKS=$QA2" >> "$GITHUB_ENV"
          node --check _site/app.js; node --check _site/sw.js
          python - <<'PY'
          import json,os
          lib=json.load(open('_site/data/library.json')); ids=[b['id'] for b in lib['books']]; assert lib['version']==os.environ['FINAL_LIBRARY_VERSION']; assert ids[-1]=='industrial-economics' and ids.count('industrial-economics')==1
          root='_site/books/industrial-economics'; import pathlib; p=pathlib.Path(root); assert len(json.load(open(p/'manifest.json'))['chapters'])==23; assert json.load(open(p/'questions.json'))['count']==100; assert len(json.load(open(p/'search.json'))['entries'])==150; assert len(list(pathlib.Path('_site/assets/industrial-economics-svg').glob('*.svg')))==20; print('FINAL_LIBRARY_READY',lib['version'],len(ids))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Re-download and verify deployed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | tail -n 1)"; DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .digest' | tail -n 1)"; test -n "$ARTIFACT_ID"; test -n "$DIGEST"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/deployed-pages.zip; SHA="$(sha256sum /tmp/deployed-pages.zip | awk '{print $1}')"; test "$SHA" = "${DIGEST#sha256:}"
          mkdir -p /tmp/deployed-pages-artifact /tmp/deployed-site; unzip -q /tmp/deployed-pages.zip -d /tmp/deployed-pages-artifact
          if [ -f /tmp/deployed-pages-artifact/artifact.tar ]; then tar -xf /tmp/deployed-pages-artifact/artifact.tar -C /tmp/deployed-site; elif [ -f /tmp/deployed-pages-artifact/artifact.tar.gz ]; then tar -xzf /tmp/deployed-pages-artifact/artifact.tar.gz -C /tmp/deployed-site; else cp -a /tmp/deployed-pages-artifact/. /tmp/deployed-site/; fi
          FINAL_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('/tmp/deployed-site'); lib=json.load(open(site/'data/library.json')); ids=[b['id'] for b in lib['books']]; assert lib['version']==os.environ['FINAL_LIBRARY_VERSION']; assert ids[-1]=='industrial-economics' and ids.count('industrial-economics')==1; root=site/'books/industrial-economics'; assert len(json.load(open(root/'manifest.json'))['chapters'])==23; assert json.load(open(root/'questions.json'))['count']==100; assert len(json.load(open(root/'search.json'))['entries'])==150; assert len(list((site/'assets/industrial-economics-svg').glob('*.svg')))==20; print('DEPLOYED_ARTIFACT_RECHECK_OK',lib['version'],len(ids))
          PY
          echo "PAGES_ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"; echo "PAGES_ARTIFACT_DIGEST=$DIGEST" >> "$GITHUB_ENV"; echo "PAGES_ARTIFACT_SHA256=$SHA" >> "$GITHUB_ENV"; echo "DEPLOYED_PAGE_URL=$DEPLOYED_PAGE_URL" >> "$GITHUB_ENV"
      - name: Record successful deployment structurally
        run: |
          set -euo pipefail
          python deploy/record_industrial_economics_deployment.py _site
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deployment_receipt.json README.md docs/shared_checkpoint.md docs/books/industrial-economics/status.md docs/books/industrial-economics/qa_report.md
          if ! git diff --cached --quiet; then git commit -m "Record industrial economics deployment [skip ci]"; git push origin HEAD:main; fi
