name: Deploy study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Compile civil law release sources
        run: |
          set -euo pipefail
          python -m py_compile \
            deploy/civil_law_overview_content.py \
            deploy/civil_law_overview_content_a.py \
            deploy/civil_law_overview_content_b.py \
            deploy/civil_law_overview_content_c.py \
            deploy/civil_law_overview_questions.py \
            deploy/generate_civil_law_overview.py \
            deploy/integrate_civil_law_overview.py \
            deploy/validate_civil_law_overview.py \
            deploy/qa_civil_law_overview.py \
            deploy/record_civil_law_overview_deployment.py

      - name: Download and verify latest formal Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_id'])")"
          ARTIFACT_DIGEST="$(python -c "import json;print(json.load(open('docs/deployment_receipt.json'))['pages_artifact_digest'])")"
          EXPECTED_SHA="${ARTIFACT_DIGEST#sha256:}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/base-pages.zip
          echo "${EXPECTED_SHA}  /tmp/base-pages.zip" | sha256sum --check -
          mkdir -p /tmp/base-pages-artifact _site
          unzip -q /tmp/base-pages.zip -d /tmp/base-pages-artifact
          if [ -f /tmp/base-pages-artifact/artifact.tar ]; then
            tar -xf /tmp/base-pages-artifact/artifact.tar -C _site
          elif [ -f /tmp/base-pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/base-pages-artifact/artifact.tar.gz -C _site
          else
            cp -a /tmp/base-pages-artifact/. _site/
          fi
          cp _site/data/library.json /tmp/pre-civil-library.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt=json.loads(Path('docs/deployment_receipt.json').read_text(encoding='utf-8'))
          library=json.loads(Path('_site/data/library.json').read_text(encoding='utf-8'))
          assert receipt['status']=='success'
          assert receipt['pages_deploy_status']=='success'
          assert library['version']==receipt['library_version'], (library['version'],receipt['library_version'])
          assert len(library['books'])==receipt['book_count']
          assert len({b['id'] for b in library['books']})==len(library['books'])
          assert (Path('_site')/'app.js').is_file() and (Path('_site')/'sw.js').is_file()
          print('FORMAL_ARTIFACT_BASE_OK',library['version'],len(library['books']))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"BASE_LIBRARY_VERSION={library['version']}\n")
              f.write(f"BASE_BOOK_COUNT={len(library['books'])}\n")
          PY

      - name: Integrate or validate civil law overview
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json,sys
          d=json.load(open('_site/data/library.json'))
          sys.exit(0 if any(b['id']=='civil-law-overview' for b in d['books']) else 1)
          PY
          then
            FINAL_LIBRARY_VERSION="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
            EXPECTED_FINAL_BOOK_COUNT="$BASE_BOOK_COUNT"
            python deploy/validate_civil_law_overview.py _site "$FINAL_LIBRARY_VERSION"
            python deploy/qa_civil_law_overview.py _site "$FINAL_LIBRARY_VERSION"
          else
            BEFORE="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"
            FINAL_LIBRARY_VERSION="$(python deploy/integrate_civil_law_overview.py _site "$BEFORE")"
            EXPECTED_FINAL_BOOK_COUNT="$((BASE_BOOK_COUNT + 1))"
          fi
          export FINAL_LIBRARY_VERSION EXPECTED_FINAL_BOOK_COUNT
          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"
          echo "EXPECTED_FINAL_BOOK_COUNT=$EXPECTED_FINAL_BOOK_COUNT" >> "$GITHUB_ENV"
          node --check _site/app.js
          node --check _site/sw.js
          python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('_site')
          pre=json.loads(Path('/tmp/pre-civil-library.json').read_text(encoding='utf-8'))
          final=json.loads((site/'data/library.json').read_text(encoding='utf-8'))
          pre_ids=[b['id'] for b in pre['books']]
          ids=[b['id'] for b in final['books']]
          assert final['version']==os.environ['FINAL_LIBRARY_VERSION']
          assert len(ids)==int(os.environ['EXPECTED_FINAL_BOOK_COUNT'])
          if 'civil-law-overview' in pre_ids:
              assert ids==pre_ids
          else:
              assert ids==pre_ids+['civil-law-overview'], (pre_ids,ids)
          root=site/'books/civil-law-overview'
          manifest=json.load(open(root/'manifest.json'))
          questions=json.load(open(root/'questions.json'))
          search=json.load(open(root/'search.json'))
          assert len(manifest['chapters'])==23
          assert questions['count']==100
          assert len(search['entries'])==150
          assert len(list((site/'assets/civil-law-overview-svg').glob('*.svg')))==20
          print('CIVIL_LIBRARY_READY',final['version'],len(ids))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Re-download and verify deployed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | tail -n 1)"
          ARTIFACT_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .digest' | tail -n 1)"
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/deployed-pages.zip
          ACTUAL_SHA="$(sha256sum /tmp/deployed-pages.zip | awk '{print $1}')"
          EXPECTED_SHA="${ARTIFACT_DIGEST#sha256:}"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          rm -rf /tmp/deployed-pages-artifact /tmp/deployed-site
          mkdir -p /tmp/deployed-pages-artifact /tmp/deployed-site
          unzip -q /tmp/deployed-pages.zip -d /tmp/deployed-pages-artifact
          if [ -f /tmp/deployed-pages-artifact/artifact.tar ]; then
            tar -xf /tmp/deployed-pages-artifact/artifact.tar -C /tmp/deployed-site
          elif [ -f /tmp/deployed-pages-artifact/artifact.tar.gz ]; then
            tar -xzf /tmp/deployed-pages-artifact/artifact.tar.gz -C /tmp/deployed-site
          else
            cp -a /tmp/deployed-pages-artifact/. /tmp/deployed-site/
          fi
          python deploy/validate_civil_law_overview.py /tmp/deployed-site "$FINAL_LIBRARY_VERSION"
          python deploy/qa_civil_law_overview.py /tmp/deployed-site "$FINAL_LIBRARY_VERSION"
          python - <<'PY'
          import json,os
          from pathlib import Path
          site=Path('/tmp/deployed-site')
          pre=json.loads(Path('/tmp/pre-civil-library.json').read_text(encoding='utf-8'))
          library=json.loads((site/'data/library.json').read_text(encoding='utf-8'))
          ids=[b['id'] for b in library['books']]
          pre_ids=[b['id'] for b in pre['books']]
          assert library['version']==os.environ['FINAL_LIBRARY_VERSION']
          assert len(ids)==int(os.environ['EXPECTED_FINAL_BOOK_COUNT'])
          if 'civil-law-overview' in pre_ids:
              assert ids==pre_ids
          else:
              assert ids==pre_ids+['civil-law-overview']
          root=site/'books/civil-law-overview'
          assert len(list((root/'chapters').glob('*.html')))==23
          assert json.load(open(root/'questions.json'))['count']==100
          assert len(json.load(open(root/'search.json'))['entries'])==150
          assert len(list((site/'assets/civil-law-overview-svg').glob('*.svg')))==20
          print('DEPLOYED_CIVIL_ARTIFACT_RECHECK_OK',library['version'],len(ids))
          PY
          echo "PAGES_ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "PAGES_ARTIFACT_DIGEST=$ARTIFACT_DIGEST" >> "$GITHUB_ENV"
          echo "PAGES_ARTIFACT_SHA256=$ACTUAL_SHA" >> "$GITHUB_ENV"
          echo "DEPLOYED_PAGE_URL=$DEPLOYED_PAGE_URL" >> "$GITHUB_ENV"

      - name: Record successful civil law deployment structurally
        run: |
          set -euo pipefail
          python deploy/record_civil_law_overview_deployment.py _site
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/deployment_receipt.json \
            README.md \
            docs/shared_checkpoint.md \
            docs/books/civil-law-overview/status.md \
            docs/books/civil-law-overview/qa_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Record civil law overview deployment [skip ci]"
            git push origin HEAD:main
          fi
