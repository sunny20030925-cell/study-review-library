name: Deploy study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download and verify website package
        run: |
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1rgPS62bIZOWC8H3zSrw-RBZ3jkg9SDcs&export=download&confirm=t' \
            -o site.zip
          echo '12b9e8f2639ac8b27157e456a985c905d91e590f88465ebf8c4b5786846f3774  site.zip' | sha256sum --check -
          mkdir _site
          python -m zipfile -e site.zip _site
          rm -rf _site/.github

      - name: Apply economics correction release
        run: |
          cat deploy/patch-economics-v2.py.gz.b64.part* | base64 --decode > /tmp/patch-economics-v2.py.gz
          echo '227fc9be243eb7de6a02ae85f80756e79f08f3a8c442cecf6e14c27f52abf167  /tmp/patch-economics-v2.py.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/patch-economics-v2.py.gz > /tmp/patch-economics-v2.py
          python -m pip install --disable-pip-version-check --quiet beautifulsoup4
          SITE_ROOT="$GITHUB_WORKSPACE/_site" python /tmp/patch-economics-v2.py

      - name: Validate corrected study library
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          site = Path('_site')
          library = json.loads((site / 'data/library.json').read_text(encoding='utf-8'))
          assert library['version'] == '2026.07.27-7'
          assert [book['id'] for book in library['books']] == ['calculus', 'accounting', 'economics']

          expected = {'calculus': 73, 'accounting': 70, 'economics': 100}
          for book_id, count in expected.items():
              root = site / 'books' / book_id
              manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
              questions = json.loads((root / 'questions.json').read_text(encoding='utf-8'))
              search = json.loads((root / 'search.json').read_text(encoding='utf-8'))
              assert manifest['id'] == book_id
              assert manifest['updatedAt'] and manifest['releaseNotes']
              assert questions['count'] == count == len(questions['items'])
              assert search['entries']
              for chapter in manifest['chapters']:
                  path = root / chapter['file']
                  assert path.is_file() and path.stat().st_size > 100

          root = site / 'books/economics'
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          questions = json.loads((root / 'questions.json').read_text(encoding='utf-8'))
          search = json.loads((root / 'search.json').read_text(encoding='utf-8'))
          assert manifest['version'] == questions['version'] == '2026.07.27-2'
          assert len([c for c in manifest['chapters'] if c['kind'] == 'chapter']) == 20
          assert len([c for c in manifest['chapters'] if c['kind'] == 'appendix']) == 3
          assert Counter(q['chapterId'] for q in questions['items']) == {f'ch{i:02d}': 5 for i in range(20)}
          assert len(search['entries']) == 144

          text = '\n'.join((root / c['file']).read_text(encoding='utf-8') for c in manifest['chapters'])
          for token in (
              '與租稅相反的價格楔', '兩者不是同一個定義', '資源稟賦',
              '正生產外部性', 'T 表示淨稅收', '簡單存款乘數',
              '實質貨幣餘額', '定額淨稅收乘數', '完整國際收支中',
              '非競爭性且非排他性',
          ):
              assert token in text
          for obsolete in (
              '補貼降低買賣雙方的有效成本', '平均成本不變為規模報酬不變',
              '資源禀賦', '非敵對且難排他的財',
          ):
              assert obsolete not in text

          figures = sorted((site / 'assets/economics-svg').glob('*.svg'))
          assert len(figures) == 20
          for figure in figures:
              svg = figure.read_text(encoding='utf-8')
              assert '<title' in svg and '<desc' in svg and 'viewBox' in svg

          app = (site / 'app.js').read_text(encoding='utf-8')
          css = (site / 'styles.css').read_text(encoding='utf-8')
          sw = (site / 'sw.js').read_text(encoding='utf-8')
          assert 'function renderReleaseNotes(manifest)' in app
          assert '.release-notes{' in css
          assert 'study-library-2026-07-27-7' in sw
          print('LIBRARY_VALIDATION_OK version=2026.07.27-7 economics=2026.07.27-2 corrections=14 questions=100')
          PY
          node --check _site/app.js
          node --check _site/sw.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              'status': 'success',
              'library_version': '2026.07.27-7',
              'economics_version': '2026.07.27-2',
              'economics_question_count': 100,
              'economics_correction_count': 14,
              'content_audit': 'passed',
              'progress_storage_changed': False,
              'book_count': 3,
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'page_url': os.environ.get('DEPLOYED_PAGE_URL', ''),
              'deployed_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('docs/deployment_receipt.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deployment_receipt.json
          git commit -m "Record successful Pages deployment [skip ci]"
          git push origin HEAD:main
