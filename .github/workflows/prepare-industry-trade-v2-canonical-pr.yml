name: Prepare Industry and Trade v2 canonical workflow once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'audit/industry-trade-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/industry-trade-v2
          fetch-depth: 0

      - name: Patch current canonical workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          t=p.read_text(encoding='utf-8')
          start=t.index('      - name: Integrate or validate industry and trade\n')
          end=t.index('      - uses: actions/upload-pages-artifact@v3\n', start)
          new='''      - name: Integrate or validate Industry and Trade v1 baseline\n        run: |\n          set -euo pipefail\n          if python - <<'PY1'\n          import json,sys\n          d=json.load(open('_site/data/library.json'))\n          sys.exit(0 if any(b['id']=='industry-trade' for b in d['books']) else 1)\n          PY1\n          then\n            FINAL_LIBRARY_VERSION="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"\n          else\n            BEFORE="$(python -c "import json;print(json.load(open('_site/data/library.json'))['version'])")"\n            FINAL_LIBRARY_VERSION="$(PYTHONPATH=deploy python deploy/integrate_industry_trade.py _site "$BEFORE")"\n          fi\n          TRADE_CONTENT_VERSION="$(python -c "import json;print(json.load(open('_site/books/industry-trade/manifest.json'))['version'])")"\n          if [ "$TRADE_CONTENT_VERSION" = "2026.07.29-1" ]; then\n            EXPECTED_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" PYTHONPATH=deploy python deploy/validate_industry_trade.py _site\n            PYTHONPATH=deploy python deploy/qa_industry_trade_independent.py _site\n          elif [ "$TRADE_CONTENT_VERSION" != "2026.07.30-1" ]; then\n            echo "unexpected Industry and Trade content version: $TRADE_CONTENT_VERSION" >&2\n            exit 1\n          fi\n\n      - name: Apply or validate Industry and Trade v2 post-publication reaudit\n        run: |\n          set -euo pipefail\n          python -m py_compile \\\n            deploy/patch_industry_trade_v2.py \\\n            deploy/qa_industry_trade_reaudit_v2.py \\\n            deploy/record_industry_trade_v2_deployment.py\n          find _site/books -type f ! -path '*/industry-trade/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-trade-v2-other-books.sha256\n          find _site/assets -type f ! -path '*/industry-trade-svg/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/pre-trade-v2-other-assets.sha256\n          FINAL_LIBRARY_VERSION="$(PYTHONPATH=deploy python deploy/patch_industry_trade_v2.py _site | tail -n 1)"\n          test -n "$FINAL_LIBRARY_VERSION"\n          PYTHONPATH=deploy python deploy/qa_industry_trade_reaudit_v2.py _site "$FINAL_LIBRARY_VERSION" | tee /tmp/industry-trade-v2-reaudit.log\n          INDUSTRY_TRADE_V2_REAUDIT_CHECKS="$(python - <<'PY2'\n          import re\n          s=open('/tmp/industry-trade-v2-reaudit.log',encoding='utf-8').read()\n          m=re.search(r'checks=(\\d+)',s)\n          if not m: raise SystemExit(1)\n          print(m.group(1))\n          PY2\n          )"\n          test "$INDUSTRY_TRADE_V2_REAUDIT_CHECKS" -ge 1500\n          find _site/books -type f ! -path '*/industry-trade/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-trade-v2-other-books.sha256\n          find _site/assets -type f ! -path '*/industry-trade-svg/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/post-trade-v2-other-assets.sha256\n          diff -u /tmp/pre-trade-v2-other-books.sha256 /tmp/post-trade-v2-other-books.sha256\n          diff -u /tmp/pre-trade-v2-other-assets.sha256 /tmp/post-trade-v2-other-assets.sha256\n          FINAL_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" python - <<'PY2'\n          import json,os\n          from pathlib import Path\n          site=Path('_site'); lib=json.load(open(site/'data/library.json')); ids=[b['id'] for b in lib['books']]\n          base=json.load(open('/tmp/base_ids.json'))\n          assert ids==base\n          assert lib['version']==os.environ['FINAL_LIBRARY_VERSION']\n          root=site/'books/industry-trade'\n          m=json.load(open(root/'manifest.json')); q=json.load(open(root/'questions.json')); s=json.load(open(root/'search.json'))\n          assert m['version']==q['version']=='2026.07.30-1'\n          assert len(m['chapters'])==23 and q['count']==100 and len(s['entries'])==160\n          assert len(list((site/'assets/industry-trade-svg').glob('*.svg')))==20\n          print('INDUSTRY_TRADE_V2_IN_PLACE_OK',lib['version'],len(ids))\n          PY2\n          node --check _site/app.js\n          node --check _site/sw.js\n          echo "FINAL_LIBRARY_VERSION=$FINAL_LIBRARY_VERSION" >> "$GITHUB_ENV"\n          echo "INDUSTRY_TRADE_V2_REAUDIT_CHECKS=$INDUSTRY_TRADE_V2_REAUDIT_CHECKS" >> "$GITHUB_ENV"\n\n'''
          t=t[:start]+new+t[end:]
          t=t.replace("          assert len(json.load(open(trade/'manifest.json'))['chapters'])==23\n          assert json.load(open(trade/'questions.json'))['count']==100\n", "          tm=json.load(open(trade/'manifest.json')); tq=json.load(open(trade/'questions.json'))\n          assert tm['version']==tq['version']=='2026.07.30-1'\n          assert len(tm['chapters'])==23\n          assert tq['count']==100\n")
          t=t.replace('          EXPECTED_LIBRARY_VERSION="$FINAL_LIBRARY_VERSION" PYTHONPATH=deploy python deploy/validate_industry_trade.py /tmp/deployed-site\n          PYTHONPATH=deploy python deploy/qa_industry_trade_independent.py /tmp/deployed-site\n', '          PYTHONPATH=deploy python deploy/qa_industry_trade_reaudit_v2.py /tmp/deployed-site "$FINAL_LIBRARY_VERSION"\n')
          t=t.replace('          python deploy/record_industry_trade_deployment.py _site\n', '          python deploy/record_industry_trade_v2_deployment.py _site\n')
          t=t.replace('            git commit -m "Record industrial economics v2 deployment [skip ci]"\n', '            git commit -m "Record Industry and Trade v2 reaudit deployment [skip ci]"\n')
          p.write_text(t,encoding='utf-8')
          PY
          python - <<'PY'
          import yaml
          yaml.safe_load(open('.github/workflows/deploy-pages.yml',encoding='utf-8'))
          print('INDUSTRY_TRADE_V2_CANONICAL_PATCH_OK')
          PY

      - name: Commit canonical change and self-remove
        run: |
          rm .github/workflows/prepare-industry-trade-v2-canonical-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-pages.yml .github/workflows/prepare-industry-trade-v2-canonical-pr.yml
          if ! git diff --cached --quiet; then
            git commit -m "Wire Industry and Trade v2 into latest canonical deployment"
            git push origin HEAD:audit/industry-trade-v2
          fi
