# One-shot stager: patch the latest canonical Pages workflow after pulling current main.
name: Stage computer fundamentals v2 deployment

on:
  push:
    branches: [main]
    paths:
      - 'deploy/patch_computer_fundamentals_v2.py'
      - 'deploy/finalize_computer_fundamentals_v2_library.py'
      - 'deploy/qa_computer_fundamentals_v2.py'
      - 'deploy/apply_computer_fundamentals_v2.py'
      - 'deploy/record_computer_fundamentals_v2_deployment.py'
      - 'deploy/patch_computer_v2_deploy_workflow.py'
      - '.github/workflows/stage-computer-fundamentals-v2-deploy.yml'

permissions:
  contents: write

concurrency:
  group: computer-fundamentals-v2-stager
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch latest canonical deployment workflow
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python -m py_compile \
            deploy/patch_computer_fundamentals_v2.py \
            deploy/finalize_computer_fundamentals_v2_library.py \
            deploy/qa_computer_fundamentals_v2.py \
            deploy/apply_computer_fundamentals_v2.py \
            deploy/record_computer_fundamentals_v2_deployment.py \
            deploy/patch_computer_v2_deploy_workflow.py
          python deploy/patch_computer_v2_deploy_workflow.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy-pages.yml'); puts 'DEPLOY_YAML_OK'"
          grep -F 'Apply or validate computer fundamentals post-publication v2 reaudit' .github/workflows/deploy-pages.yml
          grep -F 'COMPUTER_V2_QA_CHECKS' .github/workflows/deploy-pages.yml
          grep -F 'record_computer_fundamentals_v2_deployment.py' .github/workflows/deploy-pages.yml
          grep -F 'computer-fundamentals=2026.07.30-2' .github/workflows/deploy-pages.yml

      - name: Commit canonical workflow patch and remove one-shot stager
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/stage-computer-fundamentals-v2-deploy.yml
          git add .github/workflows/deploy-pages.yml .github/workflows/stage-computer-fundamentals-v2-deploy.yml
          git commit -m "Stage computer fundamentals v2 deployment"
          git pull --rebase origin main
          git push origin HEAD:main
