name: Record commercial law dispatch result

on:
  workflow_run:
    workflows: ["Trigger corrected commercial law deployment"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Write dispatch receipt
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('docs/commercial_law_dispatch_receipt.json').write_text(
              json.dumps({
                  'conclusion': os.environ['CONCLUSION'],
                  'workflow_run_id': os.environ['RUN_ID'],
                  'workflow_url': os.environ['RUN_URL'],
              }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/commercial_law_dispatch_receipt.json
          git commit -m "Record commercial law dispatch result [skip ci]"
          git push origin HEAD:main
